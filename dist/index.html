        eleveId: p.eleve_id,
        nbSeances: p.nb_seances ?? 0,

        statut: p.statut ?? "en_attente",

      const {
        data,

      } = await sb.from("eleves").insert(row).select("id").single();
      if (error) throw error;

  // Aligne eleves_groupes sur la sélection courante : ajoute les nouveaux rattachements,
  // retire ceux décochés. N'écrit jamais rien d'autre (jamais de trace hors de cette liste).
  async syncElevesGroupes(eleveId, groupeIds) {
    const {
      data: existing,

        error

  async saveFacture(factureId, eleveId, data) {

      statut: data.statut,
      mode: data.mode,

    if (factureId) {
      const {
        error
      } = await sb.from("paiements").update(row).eq("id", factureId);
      if (error) throw error;
    } else {
      const {
        error
      } = await sb.from("paiements").insert({
        eleve_id: eleveId,
        periode_debut: data.datesSeances?.[0]?.date || todayStr(),
        mois: (data.datesSeances?.[data.datesSeances.length - 1]?.date || todayStr()).slice(0, 7),
        ...row

      if (error) throw error;

  // Recalcule automatiquement la facture ouverte d'un élève à partir de l'appel.

    const {
      data: existing,
      error: e1
    } = await sb.from("paiements").select("id,statut").eq("eleve_id", eleveId).neq("statut", "paye").maybeSingle();

        }).eq("id", existing.id);

    } else if (dates.length > 0) {

        eleve_id: eleveId,
        periode_debut: dates[0].date,

// ─── MODULE RÉGLAGES ─────────────────────────────────────────
// Trois choses que l'application ne pouvait pas faire jusqu'ici :
//  · saisir les mentions légales sans qu'elles soient écrites en dur dans un
//    fichier public (l'IBAN surtout) ;
//  · sortir le livre des recettes, obligatoire pour un micro-entrepreneur ;
//  · exporter toutes les données, pour la sauvegarde comme pour le RGPD.

// Téléchargement d'un fichier produit dans le navigateur.
// Le point-virgule et le BOM sont ce qu'attend un Excel français : sans eux,
// les accents sont illisibles et tout atterrit dans une seule colonne.
const telechargerFichier = (nom, contenu, type) => {
  const blob = new Blob([contenu], { type: type || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

const versCSV = (colonnes, lignes) => {
  const cellule = v => {
    const s = v === null || v === undefined ? "" : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return "﻿" + [colonnes.map(c => cellule(c.titre)).join(";")]
    .concat(lignes.map(l => colonnes.map(c => cellule(c.valeur(l))).join(";")))
    .join("\r\n");
};

  return h("div", {
    style: {
      background: ok ? "rgba(76,175,125,.1)" : "rgba(224,85,85,.1)",

      borderRadius: 12, padding: 13, marginBottom: 16
    }
  },
    h("div", { style: { fontSize: 13, fontWeight: 800, color: ok ? C.green : C.red, marginBottom: 5 } },

function OngletLivreRecettes({ factures, eleves }) {
  const annee = new Date().getFullYear();
  const emises = factures.filter(f => f.numero).sort((a, b) => (a.numero || "").localeCompare(b.numero || ""));
  const encaissees = emises.filter(f => f.statut === "paye" && f.datePaiement);
  const total = encaissees.reduce((s, f) => s + Number(f.montant || 0), 0);
  const nomDe = eid => {
    const e = eleves.find(x => x.id === eid);
    return e ? `${e.prenom} ${e.nom}` : "—";
  };

  const exporter = () => {
    telechargerFichier(
      `livre-recettes-${annee}.csv`,
      versCSV([
        { titre: "Date d'encaissement", valeur: f => f.datePaiement },
        { titre: "N° de facture", valeur: f => f.numero },
        { titre: "Client", valeur: f => nomDe(f.eleveId) },
        { titre: "Nature", valeur: f => `Cours de soutien scolaire — ${f.nbSeances} séance(s)` },
        { titre: "Montant (€)", valeur: f => String(f.montant).replace(".", ",") },
        { titre: "Mode de règlement", valeur: f => f.mode }
      ], encaissees),
      "text/csv;charset=utf-8"
    );
  };

  return h("div", null,
    h("div", { style: { background: "rgba(212,175,55,.08)", border: "1px solid rgba(212,175,55,.2)", borderRadius: 12, padding: 13, marginBottom: 16, fontSize: 12, color: C.gray, lineHeight: 1.65 } },
      h("div", { style: { fontSize: 13, fontWeight: 800, color: C.gold, marginBottom: 5 } }, "Livre des recettes"),
      "Registre chronologique des encaissements que tout micro-entrepreneur doit tenir. Il se remplit tout seul : une ligne par facture marquée payée."),

    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 16 } },
      [
        { e: "🧾", v: emises.length, l: "Émises", c: C.gold },
        { e: "✅", v: encaissees.length, l: "Encaissées", c: C.green },
        { e: "💰", v: total.toFixed(2).replace(".", ",") + "€", l: "Recettes", c: C.green }
      ].map((s, i) => h("div", {
        key: i,
        style: { background: "rgba(212,175,55,.08)", border: "1px solid rgba(212,175,55,.15)", borderRadius: 12, padding: "12px 8px", textAlign: "center" }
      },
        h("div", { style: { fontSize: 18, marginBottom: 2 } }, s.e),
        h("div", { style: { fontSize: 15, fontWeight: 800, color: s.c, fontFamily: FD } }, s.v),
        h("div", { style: { fontSize: 10, color: C.gray, fontWeight: 700, textTransform: "uppercase" } }, s.l)))
    ),

    encaissees.length === 0
      ? h("div", { style: { textAlign: "center", padding: "30px 20px", color: C.gray, fontSize: 13, lineHeight: 1.6 } },
          "Aucune recette encaissée pour l'instant.", h("br", null),
          "Une facture entre ici quand elle est émise puis marquée payée.")
      : h("div", null,
          h("div", { style: { display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 } },
            encaissees.map(f => h("div", {
              key: f.id,
              style: { background: "rgba(255,255,255,.04)", border: "1px solid rgba(212,175,55,.12)", borderRadius: 10, padding: "10px 12px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }
            },
              h("div", { style: { minWidth: 0 } },
                h("div", { style: { fontSize: 13, fontWeight: 700, color: C.cream } }, f.numero, " · ", nomDe(f.eleveId)),
                h("div", { style: { fontSize: 11, color: C.gray } },
                  new Date(f.datePaiement + "T00:00:00").toLocaleDateString("fr-FR"), " · ", f.mode)),
              h("span", { style: { fontSize: 14, fontWeight: 800, color: C.green, fontFamily: FD, whiteSpace: "nowrap" } }, f.montant, "€")))),
          h(BtnPrimary, { label: "⬇️ Exporter le livre des recettes (CSV)", onClick: exporter, full: true })
        )
  );
}

// ─── SUIVI DE SÉANCE ─────────────────────────────────────────
// Un compte-rendu par élève et par séance : ce qui a été travaillé, ce qui a
// bloqué, les progrès, le travail à faire. C'est la matière première du bilan
// hebdomadaire envoyé aux parents.
//
// Contrainte de conception : la saisie se fait à 20 h, debout, en fin de cours,
// pour six élèves d'affilée. Tout est pensé pour tenir en deux minutes — une
// appréciation en un tap, le tronc commun du groupe saisi une seule fois, et
// les notions déjà écrites reproposées en pastilles cliquables.

const NIVEAUX_SEANCE = [
  { k: "excellent", e: "🌟", l: "Excellent", c: "#4caf7d" },
  { k: "bien",      e: "👍", l: "Bien",      c: "#8bc34a" },
  { k: "moyen",     e: "😐", l: "Moyen",     c: "#e09030" },
  { k: "difficile", e: "🧗", l: "Difficile", c: "#e05555" }
];
const niveauSeanceCfg = k => NIVEAUX_SEANCE.find(x => x.k === k) || null;

const estCompteRenduVide = v =>
  !((v.notions || "").trim() || (v.difficultes || "").trim() ||
    (v.progres || "").trim() || (v.devoirs || "").trim() || v.niveau_seance);

function MiniArea({ label, value, onChange, placeholder, rows }) {
  return h("div", { style: { marginBottom: 10 } },
    label && h("div", { style: { fontSize: 10, fontWeight: 700, color: C.gold, letterSpacing: ".8px", textTransform: "uppercase", marginBottom: 4 } }, label),
    h("textarea", {
      value: value || "",
      onChange: e => onChange(e.target.value),
      placeholder: placeholder || "",
      rows: rows || 2,
      style: {
        width: "100%", background: "rgba(255,255,255,.06)", border: "1px solid rgba(212,175,55,.2)",
        borderRadius: 8, padding: "9px 11px", color: C.cream, fontSize: 14, fontFamily: "inherit",
        outline: "none", boxSizing: "border-box", resize: "vertical", lineHeight: 1.5
      }
    })
  );
}

function Suggestions({ items, onPick }) {
  if (!items.length) return null;
  return h("div", { style: { display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 } },
    items.map(t => h("button", {
      key: t,
      onClick: () => onPick(t),
      style: { background: "rgba(212,175,55,.1)", border: "1px solid rgba(212,175,55,.25)", borderRadius: 20, padding: "5px 11px", color: C.gold, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }
    }, "+ " + t))
  );
}

function CarteSuiviEleve({ eleve, valeur, onChange, ouvert, onToggleOuvert, suggestions }) {
  const v = valeur || {};
  const set = (k, val) => onChange({ ...v, [k]: val });
  const cfg = niveauSeanceCfg(v.niveau_seance);
  const rempli = !estCompteRenduVide(v);
  const ajouterNotion = t => set("notions", (v.notions || "").trim() ? `${v.notions.trim()}, ${t}` : t);

  return h("div", {
    style: {
      background: rempli ? "rgba(212,175,55,.07)" : "rgba(255,255,255,.04)",
      border: `1px solid ${rempli ? "rgba(212,175,55,.3)" : "rgba(255,255,255,.09)"}`,
      borderRadius: 14, padding: 13, marginBottom: 10
    }
  },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 10 } },
      h(Avatar, { p: eleve.prenom, n: eleve.nom, s: 38 }),
      h("div", { style: { flex: 1, minWidth: 0 } },
        h("div", { style: { fontSize: 15, fontWeight: 800, color: C.cream, fontFamily: FD } }, `${eleve.prenom} ${eleve.nom}`),
        h("div", { style: { fontSize: 11, color: C.gray } }, eleve.niveau)),
      cfg && h("span", { style: { fontSize: 18 } }, cfg.e)
    ),

    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6, marginBottom: 10 } },
      NIVEAUX_SEANCE.map(n => {
        const on = v.niveau_seance === n.k;
        return h("button", {
          key: n.k,
          onClick: () => set("niveau_seance", on ? null : n.k),
          style: {
            background: on ? `${n.c}22` : "rgba(255,255,255,.05)",
            border: on ? `2px solid ${n.c}` : "1px solid rgba(255,255,255,.1)",
            borderRadius: 10, padding: "7px 2px", cursor: "pointer", fontFamily: "inherit",
            display: "flex", flexDirection: "column", alignItems: "center", gap: 2
          }
        },
          h("span", { style: { fontSize: 16 } }, n.e),
          h("span", { style: { fontSize: 9, fontWeight: 700, color: on ? n.c : C.gray } }, n.l));
      })
    ),

    h(MiniArea, {
      label: "Difficultés rencontrées",
      value: v.difficultes,
      onChange: t => set("difficultes", t),
      placeholder: `Ce qui a bloqué ${eleve.prenom} aujourd'hui…`
    }),

    h("button", {
      onClick: onToggleOuvert,
      style: { background: "none", border: "none", color: C.gold, cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: "inherit", padding: "2px 0" }
    }, ouvert ? "− Moins de détails" : "+ Notions, progrès, devoirs"),

    ouvert && h("div", { className: "fx-fade-slide-up", style: { marginTop: 10, borderTop: "1px solid rgba(212,175,55,.12)", paddingTop: 10 } },
      h(Suggestions, { items: suggestions, onPick: ajouterNotion }),
      h(MiniArea, { label: "Travaillé avec cet élève", value: v.notions, onChange: t => set("notions", t), placeholder: "Thalès, équations…" }),
      h(MiniArea, { label: "Progrès / points forts", value: v.progres, onChange: t => set("progres", t), placeholder: "Ce qui a bien marché…" }),
      h(MiniArea, { label: "Travail pour la prochaine fois", value: v.devoirs, onChange: t => set("devoirs", t), placeholder: "Exercices 12 à 15 p. 84" })
    )
  );
}

function ModuleSuivi({ eleves, groupes, appels, comptesRendus, monProfilId, onSave }) {
  const [etape, setEtape] = useState("groupes");
  const [date, setDate] = useState(todayStr());
  const [grp, setGrp] = useState(null);
  const [brouillon, setBrouillon] = useState({});
  const [commun, setCommun] = useState("");
  const [ouvert, setOuvert] = useState(null);
  const [saving, setSaving] = useState(false);

  const elevesMap = {};
  eleves.forEach(e => { elevesMap[e.id] = e; });

  const crsDuJour = (gid, d) => comptesRendus.filter(c => c.groupe_id === gid && c.date === d);
  // Rouvrir un suivi doit montrer ce qui a été écrit, jamais un formulaire vierge.
  const chargerBrouillon = (gid, d) => {
    const deja = {};
    crsDuJour(gid, d).forEach(c => {
      deja[c.eleve_id] = {
        notions: c.notions || "", difficultes: c.difficultes || "",
        progres: c.progres || "", devoirs: c.devoirs || "", niveau_seance: c.niveau_seance || null
      };
    });
    return deja;
  };

  const ouvrirGroupe = g => {
    setGrp(g);
    setBrouillon(chargerBrouillon(g.id, date));
    setCommun("");
    setOuvert(null);
    setEtape("saisie");
  };

  const changerDate = d => {
    setDate(d);
    if (grp) setBrouillon(chargerBrouillon(grp.id, d));
  };

  if (etape === "groupes") {
    return h("div", null,
      h("div", { style: { background: "rgba(212,175,55,.08)", border: "1px solid rgba(212,175,55,.2)", borderRadius: 14, padding: 14, marginBottom: 16 } },
        h(Lbl, { text: "Date de la séance" }),
        h("input", {
          type: "date", value: date, onChange: e => setDate(e.target.value),
          style: { width: "100%", background: "transparent", border: "1px solid rgba(212,175,55,.3)", borderRadius: 8, padding: "10px 12px", color: C.cream, fontSize: 16, fontFamily: "inherit", outline: "none", boxSizing: "border-box", colorScheme: "dark" }
        }),
        h("div", { style: { fontSize: 13, color: C.gray, marginTop: 6 } },
          "📅 " + new Date(date).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }))
      ),
      h(Lbl, { text: "Rédiger le compte-rendu" }),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
        groupes.map(g => {
          const nbCR = crsDuJour(g.id, date).length;
          const appelFait = !!appels[`ap:${g.id}:${date}`];
          return h("button", {
            key: g.id,
            onClick: () => ouvrirGroupe(g),
            style: {
              background: nbCR ? "rgba(212,175,55,.08)" : "rgba(255,255,255,.04)",
              border: nbCR ? "1.5px solid rgba(212,175,55,.4)" : "1px solid rgba(255,255,255,.1)",
              borderRadius: 14, padding: 16, cursor: "pointer", fontFamily: "inherit", textAlign: "left"
            }
          },
            h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 } },
              h("div", null,
                h("div", { style: { fontSize: 17, fontWeight: 800, color: C.cream, fontFamily: FD, marginBottom: 4 } },
                  g.nom, h("span", { style: { fontSize: 11, fontWeight: 700, color: C.gold, marginLeft: 8 } }, g.matiere)),
                h("div", { style: { fontSize: 12, color: C.gray } },

              nbCR
                ? h("span", { style: { fontSize: 11, fontWeight: 700, color: C.gold, background: "rgba(212,175,55,.15)", padding: "4px 10px", borderRadius: 20, whiteSpace: "nowrap" } }, `✓ ${nbCR} rédigé${nbCR > 1 ? "s" : ""}`)

        }),
        groupes.length === 0 && h("div", { style: { textAlign: "center", padding: "30px 0", color: C.gray, fontSize: 13 } }, "Aucun groupe pour l'instant.")
      )

  }

  if (etape === "confirme") {

        "Il alimentera automatiquement le bilan hebdomadaire envoyé aux parents."),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 10, width: "100%", maxWidth: 280 } },
        h(BtnSecondary, { label: "✏️ Modifier", onClick: () => setEtape("saisie") }),
        h(BtnPrimary, { label: "← Retour aux groupes", onClick: () => { setEtape("groupes"); setGrp(null); }, full: true }))
    );
  }

  const presMap = appels[`ap:${grp.id}:${date}`] || {};
  const appelFait = Object.keys(presMap).length > 0;
  const listeIds = appelFait ? (grp.eids || []).filter(id => presMap[id] === "present") : (grp.eids || []);

  const suggestions = [...new Set(
    comptesRendus.filter(c => c.groupe_id === grp.id).flatMap(c => splitNotions(c.notions))
  )].slice(0, 8);

  const appliquerATous = () => {
    const t = commun.trim();
    if (!t) return;
    const next = { ...brouillon };
    listeIds.forEach(id => {
      const v = next[id] || {};
      const deja = splitNotions(v.notions).some(x => x.toLowerCase() === t.toLowerCase());
      next[id] = { ...v, notions: deja ? v.notions : ((v.notions || "").trim() ? `${v.notions.trim()}, ${t}` : t) };
    });
    setBrouillon(next);
    setCommun("");
  };

  const enregistrer = async () => {
    setSaving(true);
    try {
      const complet = {};
      listeIds.forEach(id => { complet[id] = brouillon[id] || {}; });
      await onSave(grp.id, date, complet, monProfilId);
      setEtape("confirme");
    } catch (e) {
      alert("Erreur : " + e.message);
    }
    setSaving(false);
  };

  const nbRemplis = listeIds.filter(id => !estCompteRenduVide(brouillon[id] || {})).length;

  return h("div", null,
    h("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 12 } },
      h("div", { style: { fontSize: 15, fontWeight: 800, color: C.cream, fontFamily: FD } }, grp.nom),
      h("span", { style: { fontSize: 11, fontWeight: 700, color: C.gold } }, grp.matiere),
      h("button", {

        style: { marginLeft: "auto", background: "none", border: "none", color: C.gold, cursor: "pointer", fontSize: 14, fontFamily: "inherit", fontWeight: 700 }
      }, "← Groupes")
    ),

    h("div", { style: { display: "flex", alignItems: "center", gap: 8, background: "rgba(255,255,255,.04)", border: "1px solid rgba(212,175,55,.15)", borderRadius: 10, padding: "10px 14px", marginBottom: 14 } },
      h("span", { style: { fontSize: 13, color: C.gray } }, "📅"),
      h("input", {
        type: "date", value: date, onChange: e => changerDate(e.target.value),

      }),
      h("span", { style: { fontSize: 11, fontWeight: 700, color: nbRemplis ? C.gold : C.gray } }, `${nbRemplis}/${listeIds.length}`)
    ),

    !appelFait && h("div", { style: { background: "rgba(224,144,48,.1)", border: "1px solid rgba(224,144,48,.3)", borderRadius: 10, padding: "10px 12px", marginBottom: 14, fontSize: 12, color: C.orange, lineHeight: 1.5 } },
      "L'appel n'a pas encore été fait pour cette séance — tout le groupe est affiché. Faites l'appel d'abord pour ne voir que les présents."),

    h("div", { style: { background: "rgba(212,175,55,.07)", border: "1px solid rgba(212,175,55,.22)", borderRadius: 14, padding: 13, marginBottom: 14 } },
      h(Lbl, { text: "Travaillé en séance (tout le groupe)" }),
      h(Suggestions, { items: suggestions, onPick: t => setCommun(commun.trim() ? `${commun.trim()}, ${t}` : t) }),
      h("textarea", {
        value: commun,
        onChange: e => setCommun(e.target.value),

      }),
      h(BtnPrimary, { label: `↓ Appliquer aux ${listeIds.length} élèves`, onClick: appliquerATous, disabled: !commun.trim(), full: true })
    ),

    listeIds.length === 0
      ? h("div", { style: { textAlign: "center", padding: "30px 0", color: C.gray, fontSize: 13 } }, "Aucun élève présent à cette séance.")
      : listeIds.map(id => {

// ─── BILANS HEBDOMADAIRES ────────────────────────────────────
// Chaque semaine, un bilan par élève envoyé au parent. Il se rédige tout seul à
// partir de la feuille d'appel et des comptes-rendus : aucune ressaisie.
//
// L'envoi passe par un lien pré-rempli — WhatsApp, SMS ou courriel. Le message
// part du téléphone de Fouad : gratuit, immédiat, aucun compte tiers à gérer.
// Chaque envoi est tracé dans bilans_envoyes pour savoir qui a déjà reçu le sien.

const bilanDonnees = (eleve, lundi, seances, absences, crs) => {
  const uniq = arr => [...new Set(arr.filter(Boolean).map(s => s.trim()).filter(Boolean))];
  return {
    periode: libelleSemaine(lundi),
    nbSeances: seances.length,
    jours: seances.map(s => fmtJourCourt(s.date)),
    notions: [...new Set(crs.flatMap(c => splitNotions(c.notions)))],
    difficultes: uniq(crs.map(c => c.difficultes)),
    progres: uniq(crs.map(c => c.progres)),
    devoirs: uniq(crs.map(c => c.devoirs)),
    absences: absences.map(a => ({ jour: fmtDateLongue(a.date), justifie: a.statut === "absent_j" }))
  };
};

const makeBilanWhatsApp = (e, d) => {
  const L = [];
  L.push("*Boost'Étude — Bilan de la semaine*");
  L.push(`_${d.periode}_`);
  L.push("");
  L.push(`Bonjour ${e.parent},`);
  L.push("");
  L.push(`Voici le point sur ${e.prenom} cette semaine.`);
  L.push("");
  L.push(`📅 *Séances* : ${d.nbSeances}${d.jours.length ? ` (${d.jours.join(", ")})` : ""}`);
  d.absences.forEach(a => L.push(`📌 Absent(e) le ${a.jour}${a.justifie ? " (justifié)" : ""}`));
  if (d.notions.length)     L.push(`📘 *Travaillé* : ${d.notions.join(", ")}`);
  if (d.progres.length)     L.push(`✅ *Points forts* : ${phrase(d.progres.join(" "))}`);
  if (d.difficultes.length) L.push(`⚠️ *À consolider* : ${phrase(d.difficultes.join(" "))}`);
  if (d.devoirs.length)     L.push(`📝 *Pour la prochaine séance* : ${phrase(d.devoirs.join(" "))}`);
  L.push("");
  L.push("Bonne fin de semaine,");
  L.push("M. El Mkhanter — Boost'Étude");
  return L.join("\n");
};

const makeBilanSMS = (e, d) => {
  const bouts = [`Boost'Étude - Bilan de ${e.prenom} (${d.periode}) : ${d.nbSeances} séance${d.nbSeances > 1 ? "s" : ""}.`];
  if (d.absences.length)    bouts.push(`Absent(e) le ${d.absences.map(a => a.jour).join(", ")}.`);
  if (d.notions.length)     bouts.push(`Travaillé : ${d.notions.join(", ")}.`);
  if (d.progres.length)     bouts.push(`Points forts : ${phrase(d.progres.join(" "))}`);
  if (d.difficultes.length) bouts.push(`À consolider : ${phrase(d.difficultes.join(" "))}`);
  if (d.devoirs.length)     bouts.push(`À faire : ${phrase(d.devoirs.join(" "))}`);
  bouts.push("M. El Mkhanter, Boost'Étude");
  return bouts.join(" ");
};

function ModuleBilans({ eleves, groupes, appels, comptesRendus, bilans, monProfilId, onLog }) {
  const [lundi, setLundi] = useState(lundiDe(todayStr()));
  const dimanche = addJours(lundi, 6);
  const semaineId = isoSemaine(lundi);

  // Séances et absences reconstituées depuis la feuille d'appel.
  const semaineDe = eid => {
    const gs = groupes.filter(g => (g.eids || []).includes(eid));
    const presentes = [], absences = [];
    Object.entries(appels).forEach(([k, p]) => {
      const parts = k.split(":");
      if (parts[0] !== "ap") return;
      const [, gid, d] = parts;
      if (d < lundi || d > dimanche) return;
      const g = gs.find(x => x.id === gid);
      if (!g) return;
      if (p[eid] === "present") presentes.push({ date: d, matiere: g.matiere || "" });
      else if (p[eid] === "absent_j" || p[eid] === "absent_nj") absences.push({ date: d, statut: p[eid] });
    });
    presentes.sort((a, b) => a.date.localeCompare(b.date));
    absences.sort((a, b) => a.date.localeCompare(b.date));
    return { presentes, absences };
  };

  const lignes = eleves.filter(e => e.actif !== false).map(e => {
    const { presentes, absences } = semaineDe(e.id);
    if (!presentes.length && !absences.length) return null;
    const crs = comptesRendus
      .filter(c => c.eleve_id === e.id && c.date >= lundi && c.date <= dimanche)
      .sort((a, b) => a.date.localeCompare(b.date));
    return {
      eleve: e,
      donnees: bilanDonnees(e, lundi, presentes, absences, crs),
      envois: bilans.filter(b => b.eleve_id === e.id && b.semaine === semaineId)
    };
  }).filter(Boolean).sort((a, b) => a.eleve.prenom.localeCompare(b.eleve.prenom));

  const nbEnvoyes = lignes.filter(l => l.envois.length).length;
  const semaineCourante = lundi === lundiDe(todayStr());

  return h("div", null,
    h("div", { style: { display: "flex", alignItems: "center", gap: 8, background: "rgba(212,175,55,.08)", border: "1px solid rgba(212,175,55,.2)", borderRadius: 14, padding: "10px 12px", marginBottom: 14 } },
      h("button", {
        onClick: () => setLundi(addJours(lundi, -7)),
        style: { background: "rgba(255,255,255,.07)", border: "none", borderRadius: 8, padding: "8px 12px", color: C.gold, cursor: "pointer", fontSize: 16, fontFamily: "inherit" }
      }, "‹"),
      h("div", { style: { flex: 1, textAlign: "center" } },
        h("div", { style: { fontSize: 15, fontWeight: 800, color: C.cream, fontFamily: FD } }, libelleSemaine(lundi)),
        h("div", { style: { fontSize: 11, color: C.gray } }, semaineCourante ? "Semaine en cours" : "Semaine " + semaineId.split("-W")[1])),
      h("button", {
        onClick: () => setLundi(addJours(lundi, 7)),
        disabled: semaineCourante,
        style: { background: "rgba(255,255,255,.07)", border: "none", borderRadius: 8, padding: "8px 12px", color: semaineCourante ? "rgba(255,255,255,.15)" : C.gold, cursor: semaineCourante ? "default" : "pointer", fontSize: 16, fontFamily: "inherit" }
      }, "›")
    ),

    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 } },
      [
        { e: "📨", v: lignes.length, l: "À envoyer", c: C.gold },
        { e: "✅", v: `${nbEnvoyes}/${lignes.length}`, l: "Envoyés", c: C.green }
      ].map((s, i) => h("div", {
        key: i,
        style: { background: "rgba(212,175,55,.08)", border: "1px solid rgba(212,175,55,.15)", borderRadius: 12, padding: "12px 8px", textAlign: "center" }
      },
        h("div", { style: { fontSize: 18, marginBottom: 2 } }, s.e),
        h("div", { style: { fontSize: 16, fontWeight: 800, color: s.c, fontFamily: FD } }, s.v),
        h("div", { style: { fontSize: 10, color: C.gray, fontWeight: 700, textTransform: "uppercase" } }, s.l)))
    ),

    lignes.length === 0
      ? h("div", { style: { textAlign: "center", padding: "40px 20px", color: C.gray } },
          h("div", { style: { fontSize: 36, marginBottom: 12 } }, "📭"),
          h("div", { style: { fontSize: 13, lineHeight: 1.6 } },
            "Aucune séance pointée cette semaine.", h("br", null), "Les bilans apparaissent dès que l'appel est fait."))
      : lignes.map(l => h(CarteBilan, {
          key: l.eleve.id,
          eleve: l.eleve,
          donnees: l.donnees,
          envois: l.envois,
          onEnvoi: (canal, destinataire, message) => onLog({
            eleve_id: l.eleve.id, semaine: semaineId,
            periode_debut: lundi, periode_fin: dimanche,
            canal, destinataire: destinataire || null, message,
            auteur_id: monProfilId || null
          })
        }))
  );
}
