  },
  ajouter(entree) {
    const reste = fileAppels.lire().filter(x => !(x.groupeId === entree.groupeId && x.date === entree.date));
    reste.push({ ...entree, depuis: new Date().toISOString() });
    Local.ecrire(CLE_FILE_APPELS, reste);
  },
  retirer(groupeId, date) {
    Local.ecrire(CLE_FILE_APPELS, fileAppels.lire().filter(x => !(x.groupeId === groupeId && x.date === date)));
  },
  vider: () => Local.ecrire(CLE_FILE_APPELS, [])
};

// Distinguer « le réseau a manqué » de « le serveur a refusé ». Une erreur de
// droits ou de données doit remonter à l'utilisateur ; une coupure doit être
// mise de côté et rejouée.
const estPanneReseau = e => {
  if (typeof navigator !== "undefined" && navigator.onLine === false) return true;
  const m = ((e && e.message) || "").toLowerCase();
  return m.includes("failed to fetch") || m.includes("networkerror") ||
         m.includes("load failed") || m.includes("network request failed") ||
         m.includes("timeout");
};

// Enregistre l'appel, ou le garde sous le coude. Renvoie ce qui s'est passé pour
// que l'écran puisse le dire honnêtement plutôt que d'afficher une fausse réussite.
async function envoyerAppel(envoyer, groupeId, date, presMap) {
  try {
    await envoyer(groupeId, date, presMap);
    fileAppels.retirer(groupeId, date);
    Local.effacer(cleBrouillonAppel(groupeId, date));
    return { envoye: true };
  } catch (e) {
    if (estPanneReseau(e)) {
      fileAppels.ajouter({ groupeId, date, presMap });
      Local.ecrire(cleBrouillonAppel(groupeId, date), presMap);
      return { envoye: false, enAttente: true };
    }
    throw e;
  }
}

// Vide la file dès que la connexion revient. Les échecs restent en file : on
// réessaiera au prochain retour de réseau plutôt que de boucler.
async function rejouerFileAppels(envoyer) {
  const file = fileAppels.lire();
  if (!file.length) return { rejoues: 0, restants: 0 };
  let rejoues = 0;
  for (const entree of file) {
    try {
      await envoyer(entree.groupeId, entree.date, entree.presMap);
      fileAppels.retirer(entree.groupeId, entree.date);
      Local.effacer(cleBrouillonAppel(entree.groupeId, entree.date));
      rejoues++;
    } catch (e) {
      if (!estPanneReseau(e)) {
        // Le serveur refuse cet appel : le garder en file le ferait échouer
        // indéfiniment. On le sort et on le signale.
        fileAppels.retirer(entree.groupeId, entree.date);
        signalerErreur(e);
      }
    }
  }
  return { rejoues, restants: fileAppels.lire().length };
}

// État de la connexion, rafraîchi par le navigateur lui-même.
function useEnLigne() {
  const [enLigne, setEnLigne] = useState(typeof navigator === "undefined" || navigator.onLine !== false);
  useEffect(() => {
    const monter = () => setEnLigne(true);
    const tomber = () => setEnLigne(false);
    window.addEventListener("online", monter);
    window.addEventListener("offline", tomber);
    return () => {
      window.removeEventListener("online", monter);
      window.removeEventListener("offline", tomber);
    };
  }, []);
  return enLigne;
}
// ─── FACTURATION CUMULATIVE ────────────────────────────────────
// La dernière facture payée d'un élève marque la fin de la période déjà réglée.
// Tout ce qui suit (séances présentes après cette date) s'accumule sur une facture
// ouverte unique, jusqu'à ce qu'elle soit à son tour marquée payée.
// Une facture est « figée » dès qu'elle porte un numéro — elle est partie chez le
// parent — ou qu'elle est soldée. Les séances qu'elle couvre sont définitivement
// facturées ; les suivantes alimentent un nouveau brouillon, même si le parent n'a
// encore rien versé. Sans cela, une facture émise continuerait de grossir après
// avoir été envoyée, et son montant ne vaudrait plus rien.
const dernierePeriodeFin = (eid, factures) => {
  // Un stage de vacances se facture à part, au forfait : sa période ne doit pas
  // faire croire que les cours de la même semaine ont déjà été réglés.
  const figees = (factures || []).filter(f =>
    f.eleveId === eid && !f.stageId && f.statut !== "annulee" && (f.statut === "paye" || f.numero));
  let fin = null;
  figees.forEach(f => {
    const dates = f.datesSeances || [];
    const derniere = dates.reduce((max, d) => (!max || d.date > max ? d.date : max), f.periodeFin || null);
    if (derniere && (!fin || derniere > fin)) fin = derniere;
  });
  return fin;
};

// Les séances déjà portées par une facture figée, une à une (date + matière).
// Couper à « la dernière date facturée » perdait des séances pour de bon : la
// physique d'un jour où seuls les maths figuraient sur la facture, ou un appel
// saisi en retard pour une date antérieure. Une facture ancienne sans détail des
// séances garde l'ancienne règle, par sa date de fin (`avant`).
//
// Depuis 3.4.0 chaque séance facturée porte aussi son groupe (`groupeId`) : la
// clé date + groupe survit au renommage d'une matière. Les séances plus
// anciennes (date + matière seulement) restent reconnues ; et si leur matière
// n'existe plus chez l'élève — matière renommée — la date suffit.
const dejaFacturees = (eid, factures) => {
  const cles = new Set();
  const anciennes = new Map(); // date → matières inscrites sans groupe
  let avant = null;
  (factures || []).filter(f =>
    f.eleveId === eid && !f.stageId && f.statut !== "annulee" && (f.statut === "paye" || f.numero))
    .forEach(f => {
      const dates = f.datesSeances || [];
      if (dates.length) dates.forEach(d => {
        if (d.groupeId) cles.add(`${d.date}|g:${d.groupeId}`);
        else {
          cles.add(`${d.date}|${d.matiere || ""}`);
          if (!anciennes.has(d.date)) anciennes.set(d.date, new Set());
          anciennes.get(d.date).add(d.matiere || "");
        }
      });
      else if (f.periodeFin && (!avant || f.periodeFin > avant)) avant = f.periodeFin;
    });
  return { cles, anciennes, avant };
};

// Ce qu'il reste à régler sur une facture, une fois les versements déduits.
const resteDu = f => Math.max(0, Math.round(((f?.montant || 0) - (f?.encaisse || 0)) * 100) / 100);
// Un lien Stripe vaut pour le montant exact qui lui a donné naissance. Après un
// acompte en espèces, il réclamerait trop : on ne le propose plus, et le prochain
// envoi en fabrique un neuf, au bon montant.
const lienPaiementValide = f => {
  if (!f || !f.lienPaiement || !f.numero) return null;
  if (f.statut === "paye" || f.statut === "annulee") return null;
  const reste = resteDu(f);
  if (!(reste > 0)) return null;
  return Math.round(Number(f.lienMontant) * 100) / 100 === reste ? f.lienPaiement : null;
};
// Chaque séance renvoyée porte sa matière (un même élève peut suivre plusieurs
// matières, ex. Maths + Physique) afin que la facture détaille quoi a été suivi.
// Toute présence de l'élève compte, y compris dans un groupe qu'il a quitté
// depuis : sinon un changement de groupe effaçait ses séances non facturées.
const seancesOuvertes = (eid, appels, groupes, depuis) => {
  const groupeDe = id => (groupes || []).find(g => g.id === id);
  const matieresActuelles = new Set((groupes || []).filter(g => (g.eids || []).includes(eid)).map(g => g.matiere || ""));
  const dejaVue = (date, g, gid) => {
    if (!depuis) return false;
    if (typeof depuis === "string") return date <= depuis;
    if (depuis.avant && date <= depuis.avant) return true;
    const matiere = g?.matiere || "";
    if (depuis.cles.has(`${date}|g:${gid}`) || depuis.cles.has(`${date}|${matiere}`)) return true;
    // Ancienne facture dont la matière a disparu des groupes de l'élève :
    // la séance du même jour est réputée facturée (jamais deux fois).
    const old = depuis.anciennes && depuis.anciennes.get(date);
    return !!old && [...old].some(m => !matieresActuelles.has(m));
  };
  return Object.entries(appels || {}).filter(([k, p]) => {
    const [tag, gid, date] = k.split(":");
    if (tag !== "ap" || !p || p[eid] !== "present") return false;
    return !dejaVue(date, groupeDe(gid), gid);
  }).map(([k]) => {
    const [, gid, date] = k.split(":");
    return { date, matiere: groupeDe(gid)?.matiere || "", groupeId: gid };
  }).sort((a, b) => a.date.localeCompare(b.date));
};
// ── Premier cours offert (3.5.2) ──────────────────────────────────────────
// La séance offerte est la toute première présence de l'élève, tous groupes
// confondus. Elle figure sur la facture (à 0 €) mais ne se paie pas ; elle compte
// pour le rythme de facturation, et une fois facturée elle ne revient jamais.
const premiereSeance = (eid, appels) => Object.entries(appels || {})
  .filter(([k, p]) => k.startsWith("ap:") && p && p[eid] === "present")
  .map(([k]) => { const [, gid, date] = k.split(":"); return { gid, date }; })
  .sort((a, b) => a.date.localeCompare(b.date) || a.gid.localeCompare(b.gid))[0] || null;
const marquerOfferte = (eleve, dates, appels) => {
  if (!eleve || !eleve.offert) return dates;
  const p = premiereSeance(eleve.id, appels);
  if (!p) return dates;
  return (dates || []).map(d => d.date === p.date && (!d.groupeId || d.groupeId === p.gid) ? { ...d, offert: true } : d);
};
const montantSeances = (eleve, dates) =>
  parseFloat(((dates || []).filter(d => !d.offert).length * 2 * eleve.th).toFixed(2));
const seancesOffertes = dates => (dates || []).filter(d => d.offert);
const seancesPayantes = dates => (dates || []).filter(d => !d.offert);

// Regroupe une liste de séances {date,matiere} par matière, en conservant l'ordre
// d'apparition — utilisé partout où la facture doit détailler Maths/Physique séparément.
const groupParMatiere = dates => {
  const map = new Map();
  (dates || []).forEach(d => {
    const mat = d.matiere || "Cours";
    if (!map.has(mat)) map.set(mat, []);
    map.get(mat).push(d.date);
  });
  return Array.from(map, ([matiere, dates]) => ({
    matiere,
    dates
  }));
};
const horaireLabel = g => {
  if (g.jour && g.hd && g.hf) return `🕐 ${g.hd}–${g.hf} • ${g.jour}`;
  return "🕐 Horaire à définir";
};

// Lignes imprimées d'une facture, déduites de la facture elle-même.
// Le tarif horaire se lit dans le MONTANT figé (montant ÷ heures), jamais dans la
// fiche actuelle de l'élève : un élève passé de 3e en 2nde, ou une remise
// ajoutée après coup, faisait imprimer « 120,00 € » au-dessus d'un « NET À PAYER
// 100,00 € ». La dernière ligne absorbe l'arrondi pour que la somme tombe juste.
const lignesFacture = (matieres, montant, thSecours) => {
  const heures = (matieres || []).reduce((s, g) => s + g.dates.length * 2, 0);
  const m = Number(montant) || 0;
  const th = heures > 0 && m > 0 ? Math.round((m / heures) * 100) / 100 : (Number(thSecours) || 0);
  let cumul = 0;
  return (matieres || []).map((g, i, tout) => {
    const h = g.dates.length * 2;
    const total = i === tout.length - 1 && heures > 0 && m > 0
      ? Math.round((m - cumul) * 100) / 100
      : Math.round(h * th * 100) / 100;
    cumul += total;
    return { ...g, heures: h, th, total };
  });
};

// Brouillons en retard sur l'appel. Seul l'administrateur peut écrire les
// factures (sécurité de la base) : un appel enregistré par un collègue ne
// recalculait donc rien, et ses élèves n'apparaissaient jamais « à envoyer ».
// Au chargement, l'administrateur rattrape ce retard. Prudence voulue : on ne
// fait qu'AJOUTER des séances manquantes, jamais en retirer ni supprimer.
const brouillonsEnRetard = (eleves, groupes, appels, factures) => (eleves || [])
  .filter(e => e.actif !== false)
  .map(e => {
    const dates = marquerOfferte(e, seancesOuvertes(e.id, appels || {}, groupes || [], dejaFacturees(e.id, factures))
      .filter(d => !estFuture(d.date)), appels);
    const brouillon = (factures || []).find(f => f.eleveId === e.id && !f.numero && !f.stageId && f.statut !== "paye" && f.statut !== "annulee");
    const actuel = brouillon ? (brouillon.nbSeances || 0) : 0;
    return dates.length > actuel
      ? { eid: e.id, dates, montant: montantSeances(e, dates) }
      : null;
  })
  .filter(Boolean);

// ─── MESSAGES ────────────────────────────────────────────────
// `detail` : quand l'élève cumule plusieurs matières (ex. Maths + Physique) sur la même
// facture, on précise la répartition séance par matière — sinon on garde le message simple.
const detailMatieresTxt = dates => {
  const groupes = groupParMatiere(dates);
  if (groupes.length < 2) return "";
  return "\n" + groupes.map(g => `- ${g.matiere} : ${g.dates.length} séance${g.dates.length > 1 ? "s" : ""}`).join("\n");
};
// Toutes les trois séances par défaut — le seuil se règle dans l'onglet Réglages.
const SEUIL_FACTURATION_DEFAUT = 3;

// chèque. Pour un Wero ou un virement, le nom de l'enfant est indispensable : sans
// lui, l'argent arrive sans qu'on sache à qui le rattacher.
// L'identifiant Wero (numéro ou e-mail) se règle dans Réglages → Entreprise ;
// l'application le communique ici dès que les réglages sont chargés.
let CONTACT_WERO = "";
const definirContactWero = v => { CONTACT_WERO = String(v || "").trim(); };
const weroTxt = () => `Wero${CONTACT_WERO ? ` au ${CONTACT_WERO}` : ""}`;

  `${weroTxt()}, virement bancaire ou espèces. ` +
  `Pour un Wero ou un virement, merci d'indiquer « ${e.prenom} ${e.nom} » en référence.`;
// Version courte, pour les SMS.
const moyensCourts = e => `Carte (Stripe), ${weroTxt()}, virement ou espèces (référence : ${e.prenom} ${e.nom}).`;
// Séances payées et séance offerte, pour le décompte des messages.
const nbPayees = (nb, dates) => Math.max(0, (nb || 0) - seancesOffertes(dates).length);
const offerteTxt = dates => seancesOffertes(dates).length ? `1re séance offerte (${fmtDateCourt(seancesOffertes(dates)[0].date)})` : "";

// Le lien de paiement par carte, quand la facture en a un : en tête des moyens de
// règlement, parce que c'est le plus rapide pour le parent.
const ligneCarteWhatsApp = url => url ? `💳 *Payer en ligne par carte :*\n${url}\n\n` : "";
const ligneCarteTexte = url => url ? `Paiement en ligne par carte bancaire : ${url}\n\n` : "";

const mentionAutomatique = seuil =>

const signatureBoost = "Fouad Elmkhanter — Boost'Étude";

// Un stage se vend au forfait : il n'y a pas de séances à compter, seulement un

           (offerteTxt(dates) ? `${offerteTxt(dates)} : 0 €\n` : "")) +

const makeFactureSMS = (e, mois, nb, total, seuil, prestation) =>

             (offerteTxt(dates) ? `• 🎁 ${offerteTxt(dates)}\n` : "")) +

const makeRappelEmail = (e, mois, total, dates) => ({

const makeRappelSMS = (e, mois, total) =>

});

const {

// Relance : courtoise, précise, et qui rappelle ce qui a déjà été versé — un

// ─── ATOMES ──────────────────────────────────────────────────
// Les briques de l'interface, toutes taillées sur le même patron : une surface
// blanche, un bord fin, un coin arrondi de 12, une ombre à peine perceptible.
// C'est la répétition de ce patron qui fait qu'un écran jamais vu paraît connu.
//
// Les corps de texte ne descendent pas sous 12,5 px et les champs de saisie
// restent à 16 px : en dessous, le téléphone zoome tout seul au moment où on
// touche le champ, et l'écran saute sous le doigt.

// Initiales dans un rond, pour reconnaître un élève sans lire son nom.
function Avatar({ p, n, s }) {
  const size = s || 38;
  const hue = ((p?.charCodeAt(0) || 0) * 37 + (n?.charCodeAt(0) || 0) * 13) % 360;
  return h("div", {
    style: {
      width: size, height: size, borderRadius: "50%", flexShrink: 0,
      background: `hsl(${hue},42%,92%)`,
      border: `1px solid hsl(${hue},38%,80%)`,
      display: "flex", alignItems: "center", justifyContent: "center",
      fontSize: size * 0.34, fontWeight: 700, color: `hsl(${hue},45%,30%)`
    }
  }, ((p || "")[0] + (n || "")[0]).toUpperCase());
}

// Intitulé d'un champ : court, net, au-dessus de ce qu'il nomme.
function Lbl({ text }) {
  return h("div", {
    style: { fontSize: 13, fontWeight: 600, color: "#374151", marginBottom: 5 }
  }, text);
}

// Petit surtitre qui ouvre une section ("À venir", "Terminés").
function Surtitre({ texte, discret }) {
  return h("div", {

// ─── BANDEAUX ────────────────────────────────────────────────
// Les alertes du navigateur arrêtaient l'application en pleine action : sur un
// téléphone, un appel en cours disparaissait derrière une boîte grise. Les
// messages s'affichent maintenant par-dessus l'écran, sans rien interrompre.
//
// Un bus minuscule plutôt qu'un contexte React : n'importe quel module peut
// signaler quelque chose sans qu'on fasse descendre une fonction de props en
// props à travers vingt composants.
const Signal = {
  _abonnes: [],
  emettre(type, texte) {
    Signal._abonnes.forEach(f => {
      try { f(type, texte); } catch (e) {}
    });
  },
  abonner(f) {
    Signal._abonnes.push(f);
    return () => { Signal._abonnes = Signal._abonnes.filter(x => x !== f); };
  }
};

const signalerErreur = e => Signal.emettre("erreur", (e && e.message) || String(e || "Une erreur est survenue"));
const signalerSucces = t => Signal.emettre("succes", t);
const signalerInfo = t => Signal.emettre("info", t);

const APPARENCE_BANDEAU = {
  succes: { fond: C.greenPale, bord: C.greenBord, teinte: C.green, icone: "✅" },
  erreur: { fond: C.redPale, bord: C.redBord, teinte: C.red, icone: "⚠️" },
  info:   { fond: C.bluePale, bord: C.blueBord, teinte: C.blue, icone: "ℹ️" }
};

function PileBandeaux() {
  const [messages, setMessages] = useState([]);

  useEffect(() => Signal.abonner((type, texte) => {
    const id = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    setMessages(m => [...m.slice(-2), { id, type, texte }]);
    // Une réussite se lit au passage et s'efface seule. Une erreur reste :
    // elle demande une décision, pas un coup d'œil.
    if (type !== "erreur") {
      setTimeout(() => setMessages(m => m.filter(x => x.id !== id)), 5000);
    }
  }), []);

  if (!messages.length) return null;

  return h("div", {
    style: {
      position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)",
      zIndex: 9000, width: "calc(100% - 24px)", maxWidth: 440,
      display: "flex", flexDirection: "column", gap: 8, pointerEvents: "none"
    }
  }, messages.map(m => {
    const a = APPARENCE_BANDEAU[m.type] || APPARENCE_BANDEAU.info;
    return h("div", {
      key: m.id,
      className: "fx-fade-slide-up",
      onClick: () => setMessages(x => x.filter(y => y.id !== m.id)),
      style: {
        pointerEvents: "auto", cursor: "pointer",
        background: a.fond, border: `1px solid ${a.bord}`, borderRadius: 12,
        padding: "12px 14px", display: "flex", alignItems: "flex-start", gap: 10,
        boxShadow: C.ombreForte
      }
    },
      h("span", { style: { fontSize: 16, lineHeight: "20px" } }, a.icone),
      h("div", { style: { flex: 1, fontSize: 14, lineHeight: 1.45, color: C.texte, fontWeight: 600 } }, m.texte),
      h("span", { style: { color: a.teinte, fontSize: 18, lineHeight: "20px", fontWeight: 700 } }, "×"));
  }));
}

// @boostetude.fr n'ont pas de boîte aux lettres. Elle reste donc affichée, en

const LONGUEUR_MOT_DE_PASSE = 8;

function FenetreCompte({ profil, email, onFermer, onChanger, onDeconnexion }) {
  const [nouveau, setNouveau] = useState("");

  const valider = async () => {

    setEnCours(true);

      await onChanger(nouveau);
      setFait(true);
      setNouveau("");
      setConfirmation("");
      signalerSucces("Mot de passe changé. Gardez-le précieusement.");

// ─── PANNEAU ENVOI ────────────────────────────────────────────
// Ce que le téléphone sait faire, et ce qu'il ne sait pas :
//
//  · Le PDF ne peut rejoindre une conversation que par le partage du système
//    (menu « Partager »), qui dépose le fichier dans WhatsApp, un mail, Drive.
//  · Un SMS ne transporte pas de pièce jointe — jamais, c'est le protocole. Le
//    message SMS porte donc le montant et les modalités, pas la facture.
//  · Les liens wa.me / sms: / mailto: ne portent que du texte, d'où deux gestes
//    distincts : partager le fichier, puis envoyer le message (ou l'inverse).
//
// Rien n'est envoyé par l'application : tout part du téléphone de Fouad, depuis
// son propre numéro. Aucun abonnement à un service d'envoi, aucune donnée confiée
// à un tiers.
function PanneauEnvoi({
  eleve,
  mois,
  nb,
  montant,
  dates,
  type,
  justifie,
  facture,
  parametres,
  seuil
}) {
  // Pour une absence, l'aperçu s'ouvre par défaut : la formulation exacte doit être
  // visible avant l'envoi, pas seulement accessible via l'œil.
  const [apercu, setApercu] = useState(type === "absence" || type === "alerte_absences" ? "email" : null);
  const [copie, setCopie] = useState(null);
  const [envoiPDF, setEnvoiPDF] = useState(false);

  const isF = type === "facture";
  const isA = type === "absence";
  // Absences répétées : `dates` porte alors les dates d'absence, pas de séance.
  const isAl = type === "alerte_absences";
  const accent = isF ? C.green : isA ? C.blue : isAl ? C.red : C.orange;
  const fondBase = isF ? C.greenPale : isA ? C.bluePale : isAl ? C.redPale : C.orangePale;
  const bordBase = isF ? C.greenBord : isA ? C.blueBord : isAl ? C.redBord : C.orangeBord;

  // Forfait de stage : le message annonce la prestation, pas un décompte de séances.
  const forfait = (facture && facture.prestation) || null;

  const lienCarte = isF ? lienPaiementValide(facture) : null;
  const emailData = isF ? makeFactureEmail(eleve, mois, nb, montant, dates, seuil, forfait, lienCarte)
    : isA ? makeAbsenceEmail(eleve, mois, justifie)
    : isAl ? makeAlerteAbsencesEmail(eleve, dates || [])
    : makeRappelEmail(eleve, mois, montant, dates);

//  · l'alerte revient par paliers : 3e absence, puis 6e, 9e…

const SEUIL_ALERTE_ABSENCES = 3;

// Rien au-delà de la date de référence : une séance à venir n'a pas eu lieu.
const absencesNonJustifiees = (eid, appels, ref) => {
  const debut = debutAnneeScolaire(ref), fin = finAnneeScolaire(ref);
  return Object.entries(appels || {}).filter(([k, p]) => {
    const [t, , d] = k.split(":");

    LARGEUR, HAUTEUR, liens,
    /** Zone cliquable qui ouvre une adresse web (annotation /Link du PDF). */
    lien(x, haut, largeur, hauteur, url) {
      liens.push({ x1: n2(x), y1: n2(y(haut + hauteur)), x2: n2(x + largeur), y2: n2(y(haut)), url: String(url) });
      return this;
    },
    rect(x, haut, largeur, hauteur, couleur) {
      const [r, v, b] = couleur;
      ops.push(`${n2(r)} ${n2(v)} ${n2(b)} rg`, `${n2(x)} ${n2(y(haut + hauteur))} ${n2(largeur)} ${n2(hauteur)} re f`);
      return this;
    },
    ligne(x1, haut1, x2, haut2, couleur, epaisseur) {
      const [r, v, b] = couleur;
      ops.push(`${n2(r)} ${n2(v)} ${n2(b)} RG`, `${n2(epaisseur || 0.5)} w`,
               `${n2(x1)} ${n2(y(haut1))} m ${n2(x2)} ${n2(y(haut2))} l S`);
      return this;
    },
    texte(x, haut, contenu, opts = {}) {
      const { taille = 10, gras = false, couleur = [0, 0, 0], align = "gauche" } = opts;
      const [r, v, b] = couleur;
      let posX = x;
      if (align === "droite") posX = x - largeurTexte(contenu, taille, gras);
      else if (align === "centre") posX = x - largeurTexte(contenu, taille, gras) / 2;
      ops.push("BT", `/${gras ? "F2" : "F1"} ${n2(taille)} Tf`, `${n2(r)} ${n2(v)} ${n2(b)} rg`,
               `1 0 0 1 ${n2(posX)} ${n2(y(haut))} Tm`, `(${echapperPDF(contenu)}) Tj`, "ET");
      return this;
    },
    /** Écrit un paragraphe et renvoie l'ordonnée atteinte. */
    paragraphe(x, haut, contenu, largeurMax, opts = {}) {
      const { taille = 10, gras = false, interligne = 1.35 } = opts;
      let courant = haut;
      couperLignes(contenu, largeurMax, taille, gras).forEach(ligne => {
        this.texte(x, courant, ligne, opts);
        courant += taille * interligne;
      });
      return courant;
    },
    flux: () => ops.join("\n")
  };
}

/** Assemble les objets, la table de références et la queue du fichier. */
function assemblerPDF(page, meta = {}) {
  const flux = page.flux();
  // Les annotations de lien viennent après les sept objets fixes (n° 8 et suivants).
  // Une adresse web est en ASCII : on n'échappe que ce que la syntaxe PDF réserve.
  const liens = page.liens || [];
  const annots = liens.length ? ` /Annots [${liens.map((_, i) => `${8 + i} 0 R`).join(" ")}]` : "";
  const objets = [
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${n2(page.LARGEUR)} ${n2(page.HAUTEUR)}] ` +
      `/Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R${annots} >>`,
    `<< /Length ${flux.length} >>\nstream\n${flux}\nendstream`,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>",
    "<< /Title (" + chaineUTF16(meta.titre || "Facture") + ") /Producer (Boost'Etude) >>",
    ...liens.map(l => {
      const uri = l.url.replace(/[^\x21-\x7e]/g, "").replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
      return `<< /Type /Annot /Subtype /Link /Rect [${l.x1} ${l.y1} ${l.x2} ${l.y2}] /Border [0 0 0] /A << /S /URI /URI (${uri}) >> >>`;
    })
  ];

  let fichier = "%PDF-1.4\n";
  const positions = [];
  objets.forEach((corps, i) => {
    positions.push(fichier.length);
    fichier += `${i + 1} 0 obj\n${corps}\nendobj\n`;
  });

  const debutXref = fichier.length;
  fichier += `xref\n0 ${objets.length + 1}\n0000000000 65535 f \n`;
  positions.forEach(p => { fichier += String(p).padStart(10, "0") + " 00000 n \n"; });
  fichier += `trailer\n<< /Size ${objets.length + 1} /Root 1 0 R /Info 7 0 R >>\n` +
             `startxref\n${debutXref}\n%%EOF`;

  const octets = new Uint8Array(fichier.length);
  for (let i = 0; i < fichier.length; i++) octets[i] = fichier.charCodeAt(i) & 0xff;
  return octets;
}

const NAVY_PDF = [0.039, 0.078, 0.157];   // #0a1428
const OR_PDF = [0.831, 0.686, 0.216];     // #d4af37
const GRIS = [0.42, 0.42, 0.42];
const GRIS_PALE = [0.62, 0.62, 0.62];
const NOIR = [0.1, 0.1, 0.1];

/**
 * Dessine la facture. Le contenu reprend exactement celui de l'écran
 * (`VueImpression`) : mêmes mentions légales, mêmes totaux, même pied de page.
 */
function construireFacturePDF(facture, eleve, parametres) {
  const p = parametres || {};
  const page = PageA4();
  const M = 48;                       // marge
  const DROITE = page.LARGEUR - M;
  const dates = facture.datesSeances || [];
  const emise = !!facture.numero;
  // La séance offerte s'imprime sur sa propre ligne, à 0 € : les lignes payantes
  // gardent leur vrai tarif horaire.
  const offertes = seancesOffertes(dates);
  const matieres = groupParMatiere(seancesPayantes(dates));
  // Un stage de vacances ne se compte pas en séances : il se vend au forfait.
  // `prestation` porte alors le libellé à imprimer, et le montant fait la ligne.
  const forfait = (facture.prestation || "").trim();
  const mentionEI = (p.forme_juridique || "EI").toUpperCase() === "EI" ? "Entrepreneur individuel" : p.forme_juridique;

  let y = M + 10;

  // ── En-tête : l'émetteur à gauche, l'identification de la facture à droite ──
  page.texte(M, y, p.denomination || "Boost'Étude", { taille: 19, gras: true, couleur: NAVY_PDF });
  let yg = y + 16;
  [
    p.exploitant ? `${p.exploitant} · ${mentionEI}` : null,
    p.adresse || null,
    [p.code_postal, p.ville].filter(Boolean).join(" ") || null,
    p.siret ? `SIRET ${p.siret}${p.ape ? ` · APE ${p.ape}` : ""}` : null,
    p.telephone || null,
    p.email || null
  ].filter(Boolean).forEach(l => {
    page.texte(M, yg, l, { taille: 8.5, couleur: GRIS });
    yg += 11;
  });

  page.texte(DROITE, y - 2, "FACTURE", { taille: 9, gras: true, couleur: OR_PDF, align: "droite" });
  page.texte(DROITE, y + 13, emise ? `N° ${facture.numero}` : "BROUILLON",
    { taille: 13, gras: true, couleur: emise ? NAVY_PDF : [0.69, 0.13, 0.13], align: "droite" });
  let yd = y + 27;
  if (emise && facture.dateEmission) {
    page.texte(DROITE, yd, `Émise le ${fmtDateLongue(facture.dateEmission)}`, { taille: 8.5, couleur: GRIS, align: "droite" });
    yd += 11;
  }
  const periodeForfait = facture.periodeDebut
    ? (facture.periodeFin && facture.periodeFin !== facture.periodeDebut
        ? `Du ${fmtDateCourt(facture.periodeDebut)} au ${fmtDateLongue(facture.periodeFin)}`
        : fmtDateLongue(facture.periodeDebut))
    : "";
  const periode = forfait ? (periodeForfait || "Forfait")
    : dates.length
      ? (dates.length === 1 ? fmtDateLongue(dates[0].date) : `${fmtDateCourt(dates[0].date)} – ${fmtDateCourt(dates[dates.length - 1].date)}`)
      : "Facture en cours";
  page.texte(DROITE, yd, periode, { taille: 8.5, couleur: GRIS, align: "droite" });

  y = Math.max(yg, yd) + 16;
  page.rect(M, y, DROITE - M, 2, NAVY_PDF);
  y += 20;

  // ── Destinataire ───────────────────────────────────────────
  page.rect(M, y - 10, DROITE - M, 48, [0.97, 0.97, 0.96]);
  page.texte(M + 12, y + 2, "FACTURÉ À", { taille: 7.5, gras: true, couleur: GRIS_PALE });
  page.texte(M + 12, y + 16, eleve.parent || "", { taille: 12, gras: true, couleur: NAVY_PDF });
  page.texte(M + 12, y + 30, `Élève : ${eleve.prenom} ${eleve.nom} — ${eleve.niveau}`, { taille: 10, couleur: GRIS });
  y += 60;

  // ── Tableau des prestations ────────────────────────────────
  const COL_QTE = DROITE - 190, COL_TARIF = DROITE - 95;
  page.rect(M, y - 10, DROITE - M, 22, NAVY_PDF);
  page.texte(M + 10, y + 4, "Prestation", { taille: 9, gras: true, couleur: [1, 1, 1] });
  page.texte(COL_QTE, y + 4, "Qté", { taille: 9, gras: true, couleur: [1, 1, 1], align: "droite" });
  page.texte(COL_TARIF, y + 4, "Tarif", { taille: 9, gras: true, couleur: [1, 1, 1], align: "droite" });
  page.texte(DROITE - 10, y + 4, "Total", { taille: 9, gras: true, couleur: [1, 1, 1], align: "droite" });
  y += 26;

  if (forfait) {
    const total = Number(facture.montant) || 0;
    page.texte(M + 10, y + 4, forfait, { taille: 10, gras: true, couleur: NOIR });
    const finLigne = page.paragraphe(M + 10, y + 16,
      `Forfait tout compris${periodeForfait ? ` · ${periodeForfait.toLowerCase()}` : ""}` +
      (eleve.niveau ? ` · niveau ${eleve.niveau}` : ""),
      COL_QTE - M - 30, { taille: 8, couleur: GRIS, interligne: 1.3 });
    page.texte(COL_QTE, y + 4, "1", { taille: 9.5, couleur: GRIS, align: "droite" });
    page.texte(COL_TARIF, y + 4, euros(total), { taille: 9.5, couleur: GRIS, align: "droite" });
    page.texte(DROITE - 10, y + 4, euros(total), { taille: 10, gras: true, couleur: NAVY_PDF, align: "droite" });
    y = Math.max(finLigne, y + 24) + 6;
  } else if (matieres.length === 0 && offertes.length === 0) {
    page.texte(M + 10, y + 6, "Aucune séance", { taille: 9.5, couleur: GRIS });
    y += 24;
  } else {
    lignesFacture(matieres, facture.montant, eleve.th).forEach((g, i) => {
      const total = g.total;
      page.texte(M + 10, y + 4, `${g.matiere || "Cours"} — ${eleve.niveau}`, { taille: 10, gras: true, couleur: NOIR });
      page.texte(M + 10, y + 16,
        `Cours de soutien scolaire en groupe · séances de 2 h · ${g.dates.length} séance${g.dates.length > 1 ? "s" : ""}` +
        (eleve.remise > 0 && Math.abs(g.th - eleve.th) < 0.005 ? ` · remise de ${euros(eleve.remise)}/h (inscriptions multiples)` : ""),
        { taille: 8, couleur: GRIS });
      const finDates = page.paragraphe(M + 10, y + 27, g.dates.map(d => fmtDateCourt(d)).join(" · "),
        COL_QTE - M - 30, { taille: 8, couleur: GRIS_PALE, interligne: 1.3 });
      page.texte(COL_QTE, y + 4, `${g.dates.length * 2} h`, { taille: 9.5, couleur: GRIS, align: "droite" });
      page.texte(COL_TARIF, y + 4, `${euros(g.th)}/h`, { taille: 9.5, couleur: GRIS, align: "droite" });
      page.texte(DROITE - 10, y + 4, euros(total), { taille: 10, gras: true, couleur: NAVY_PDF, align: "droite" });
      y = Math.max(finDates, y + 34) + 6;
      if (i < matieres.length - 1) {
        page.ligne(M, y - 3, DROITE, y - 3, [0.9, 0.9, 0.9], 0.5);
        y += 4;
      }
    });
  }
  if (!forfait && offertes.length) {
    if (matieres.length) { page.ligne(M, y - 3, DROITE, y - 3, [0.9, 0.9, 0.9], 0.5); y += 4; }
    page.texte(M + 10, y + 4, "Première séance offerte", { taille: 10, gras: true, couleur: NOIR });
    page.texte(M + 10, y + 16, `Cours d'essai · ${offertes.map(d => fmtDateCourt(d.date)).join(" · ")}`, { taille: 8, couleur: GRIS });
    page.texte(COL_QTE, y + 4, `${offertes.length * 2} h`, { taille: 9.5, couleur: GRIS, align: "droite" });
    page.texte(COL_TARIF, y + 4, "offert", { taille: 9.5, couleur: GRIS, align: "droite" });
    page.texte(DROITE - 10, y + 4, euros(0), { taille: 10, gras: true, couleur: NAVY_PDF, align: "droite" });
    y += 30;
  }

  // ── Total, acomptes, net à payer ───────────────────────────
  const encaisse = Math.max(0, Number(facture.encaisse) || 0);
  const reste = Math.max(0, Math.round(((Number(facture.montant) || 0) - encaisse) * 100) / 100);
  y += 8;
  if (encaisse > 0) {
    // Le détail du règlement partiel se lit avant le solde, comme sur un relevé.
    page.texte(DROITE - 120, y + 4, "Total", { taille: 9.5, couleur: GRIS, align: "droite" });
    page.texte(DROITE, y + 4, euros(facture.montant), { taille: 9.5, couleur: NOIR, align: "droite" });
    page.texte(DROITE - 120, y + 18, "Déjà réglé", { taille: 9.5, couleur: GRIS, align: "droite" });
    page.texte(DROITE, y + 18, "- " + euros(encaisse), { taille: 9.5, couleur: [0.18, 0.49, 0.31], align: "droite" });
    y += 28;
  }
  page.rect(M, y - 8, DROITE - M, 34, NAVY_PDF);
  page.texte(M + 16, y + 13, encaisse > 0 ? "RESTE À PAYER" : "NET À PAYER", { taille: 11, gras: true, couleur: [1, 1, 1] });
  page.texte(DROITE - 16, y + 15, euros(encaisse > 0 ? reste : facture.montant), { taille: 19, gras: true, couleur: OR_PDF, align: "droite" });
  y += 38;
  page.texte(DROITE, y + 4, p.mention_tva || "TVA non applicable, article 293 B du CGI",
    { taille: 8.5, couleur: GRIS, align: "droite" });
  y += 20;

  // ── Règlement ──────────────────────────────────────────────
  page.ligne(M, y, DROITE, y, [0.9, 0.9, 0.9], 0.5);
  y += 14;
  const payee = facture.statut === "paye" || (encaisse > 0 && reste === 0);
  page.texte(M, y, "Règlement", { taille: 9.5, gras: true, couleur: NOIR });
  y += 13;
  if (payee) {
    page.texte(M, y, `Facture acquittée${facture.datePaiement ? ` le ${fmtDateCourt(facture.datePaiement)}` : ""} (${facture.mode || eleve.mp}).`,
      { taille: 9, couleur: [0.18, 0.49, 0.31] });
    y += 13;
  } else {
    // Paiement par carte : un encadré doré, cliquable d'un bout à l'autre. On montre
    // l'adresse en clair, pour qui imprime la facture.
    const lienCarte = lienPaiementValide(facture);
    definirContactWero(p.wero);
    if (lienCarte) {
      page.rect(M, y - 2, DROITE - M, 34, [0.99, 0.97, 0.9]);
      page.ligne(M, y - 2, M, y + 32, OR_PDF, 2);
      page.texte(M + 10, y + 11, "Payer en ligne par carte bancaire — cliquez ici", { taille: 9.5, gras: true, couleur: NAVY_PDF });
      page.texte(M + 10, y + 24, lienCarte, { taille: 8, couleur: GRIS });
      page.lien(M, y - 2, DROITE - M, 34, lienCarte);
      y += 42;
    }
    y = page.paragraphe(M, y, MOYENS_PAIEMENT_TEXTE(eleve, lienCarte), DROITE - M, { taille: 9, couleur: GRIS, interligne: 1.45 });
    y += 2;
    if (p.iban) {
      page.rect(M, y, DROITE - M, 44, [0.97, 0.97, 0.96]);
      page.texte(M + 10, y + 13, "Coordonnées bancaires", { taille: 8.5, gras: true, couleur: NOIR });
      page.texte(M + 10, y + 25, `${p.titulaire_compte ? p.titulaire_compte + " · " : ""}IBAN ${p.iban}${p.bic ? " · BIC " + p.bic : ""}`,
        { taille: 8, couleur: GRIS });
      page.texte(M + 10, y + 36, `Référence à indiquer : ${eleve.prenom} ${eleve.nom}`, { taille: 8, gras: true, couleur: NOIR });
      y += 52;
    }
  }
  if (p.delai_paiement) {
    page.texte(M, y + 4, p.delai_paiement, { taille: 8.5, couleur: GRIS });
    y += 16;
  }

  // ── Pied de facture : mentions obligatoires ────────────────
  const raisonSociale = [p.denomination, p.exploitant && p.exploitant !== p.denomination ? p.exploitant : null].filter(Boolean).join(" — ");
  let pied = page.HAUTEUR - M - 34;
  page.ligne(M, pied - 8, DROITE, pied - 8, [0.93, 0.93, 0.93], 0.5);
  [
    p.penalites_retard,
    p.escompte,
    [raisonSociale || "Boost'Étude", mentionEI, p.siret ? "SIRET " + p.siret : null, p.ape ? "APE " + p.ape : null].filter(Boolean).join(" · ")
  ].filter(Boolean).forEach(l => {
    pied = page.paragraphe(M, pied, l, DROITE - M, { taille: 6.8, couleur: GRIS_PALE, interligne: 1.35 });
    pied += 1;
  });

  return assemblerPDF(page, { titre: `Facture ${facture.numero || "brouillon"} — ${eleve.prenom} ${eleve.nom}` });
}

const nomFichierFacture = (facture, eleve) => {
  const base = facture.numero ? facture.numero : "brouillon";
  const qui = `${eleve.prenom}-${eleve.nom}`.replace(/[^A-Za-zÀ-ÿ0-9]+/g, "-").replace(/^-|-$/g, "");
  return `Facture-${base}-${qui}.pdf`.replace(/\s+/g, "");
};

const facturePDFBlob = (facture, eleve, parametres) =>
  new Blob([construireFacturePDF(facture, eleve, parametres)], { type: "application/pdf" });

/**
 * Partage le PDF par les applications du téléphone — WhatsApp, mail, Drive.
 * Un SMS ne transporte pas de pièce jointe : le partage natif est le seul chemin
 * qui dépose vraiment le fichier dans une conversation. Sur un ordinateur, ou si le
 * navigateur ne sait pas partager de fichiers, on retombe sur le téléchargement.
 */
async function partagerFacturePDF(facture, eleve, parametres, texte) {
  const blob = facturePDFBlob(facture, eleve, parametres);
  const nom = nomFichierFacture(facture, eleve);
  const fichier = typeof File === "function" ? new File([blob], nom, { type: "application/pdf" }) : null;

  if (fichier && navigator.canShare && navigator.canShare({ files: [fichier] })) {
    try {
      await navigator.share({ files: [fichier], text: texte || "" });
      return { partage: true };
    } catch (e) {
      // L'utilisateur a refermé le menu de partage : ce n'est pas une erreur.
      if (e && e.name === "AbortError") return { partage: false, annule: true };
    }
  }
  telechargerBlob(blob, nom);
  return { partage: false, telecharge: true };
}

function telechargerBlob(blob, nom) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
// ─── VUE IMPRESSION ──────────────────────────────────────────
// La facture telle qu'elle part chez les parents. Deux états bien distincts :
//
//  · BROUILLON — la facture s'alimente encore toute seule depuis la feuille
//    d'appel, chaque séance pointée la fait grossir. Elle n'a pas de numéro et
//    ne doit pas être envoyée.
//  · ÉMISE — le numéro séquentiel est attribué une fois pour toutes par la base
//    (fonction emettre_facture), la date d'émission est figée. Une facture émise
//    ne se renumérote jamais : c'est ce que demande l'administration.
//
// Les mentions légales viennent de la table parametres_entreprise, jamais du
// code : ce fichier est public, l'IBAN n'a rien à y faire.
function champsManquants(p) {
  const requis = [["denomination", "dénomination"], ["exploitant", "nom de l'exploitant"], ["siret", "SIRET"], ["adresse", "adresse"], ["ville", "ville"]];
  return requis.filter(([k]) => !(p && (p[k] || "").trim())).map(([, libelle]) => libelle);
}

function VueImpression({
  facture,
  eleve,
  parametres,
  onClose,
  onDelete,
  onEmettre
}) {
  const [emission, setEmission] = useState(false);
  const p = parametres || {};
  const dates = facture.datesSeances || [];
  const periodeLabelCours = dates.length ? dates.length === 1 ? fmtDateLongue(dates[0].date) : `${fmtDateCourt(dates[0].date)} – ${fmtDateCourt(dates[dates.length - 1].date)}` : "Facture en cours";
  const offertes = seancesOffertes(dates);
  const matieresGroupees = groupParMatiere(seancesPayantes(dates));
  // Un stage se vend au forfait : une seule ligne, le libellé et son montant.
  const forfait = (facture.prestation || "").trim();
  const periodeForfait = facture.periodeDebut
    ? (facture.periodeFin && facture.periodeFin !== facture.periodeDebut
        ? `Du ${fmtDateCourt(facture.periodeDebut)} au ${fmtDateLongue(facture.periodeFin)}`
        : fmtDateLongue(facture.periodeDebut))
    : "";
  const periodeLabel = forfait ? (periodeForfait || "Forfait") : periodeLabelCours;
  const emise = !!facture.numero;
  const manquants = champsManquants(p);

  const raisonSociale = [p.denomination, p.exploitant && p.exploitant !== p.denomination ? p.exploitant : null].filter(Boolean).join(" — ");
  const mentionEI = (p.forme_juridique || "EI").toUpperCase() === "EI" ? "Entrepreneur individuel" : p.forme_juridique;

  const emettre = async () => {
    if (manquants.length) {
      signalerErreur({ message: "Complétez d'abord vos informations légales dans Réglages : " + manquants.join(", ") });
      return;
    }

    setEmission(true);

  const ligneGrise = (contenu, i) => h("div", { key: i, style: { fontSize: 10, color: "#8a8a8a", lineHeight: 1.7 } }, contenu);

  return h("div", { style: { position: "fixed", inset: 0, zIndex: 600, background: C.fond, overflowY: "auto" } },
    h("div", { className: "zone-facture", style: { maxWidth: 520, margin: "0 auto", padding: "20px 16px 60px" } },

      // ── Barre d'actions (jamais imprimée) ──────────────────
      h("div", { className: "sans-impression", style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, gap: 8 } },

          }, "🗑 Supprimer"),

        h("div", { style: { fontSize: 12, color: C.gray, lineHeight: 1.6, marginBottom: 10 } },

      h("div", { className: "facture-papier", style: { background: "#fff", borderRadius: 16, padding: "28px 24px", color: "#1a1a1a", fontFamily: "Georgia,serif", marginTop: 14, boxShadow: "0 8px 40px rgba(0,0,0,.4)" } },

                }, entete))

                  h("td", { style: { padding: "12px", textAlign: "right", color: "#444" } }, "1"),

            : matieresGroupees.length > 0
              ? lignesFacture(matieresGroupees, facture.montant, eleve.th).map((g, i) => {
                  const total = g.total;
                  return h("tr", { key: g.matiere, style: { borderBottom: i < matieresGroupees.length - 1 ? "1px solid #eee" : "none" } },
                    h("td", { style: { padding: "12px" } },
                      h("div", { style: { fontWeight: 600, color: "#222" } }, `${g.matiere || "Cours"} — ${eleve.niveau}`),
                      h("div", { style: { fontSize: 11, color: "#888", marginTop: 2 } },
                        `Cours de soutien scolaire en groupe · séances de 2 h · ${g.dates.length} séance${g.dates.length > 1 ? "s" : ""}`),
                      h("div", { style: { fontSize: 11, color: "#999", marginTop: 4, lineHeight: 1.6 } },

                })

              h("td", { style: { padding: "12px" } },
                h("div", { style: { fontWeight: 600, color: "#222" } }, "🎁 Première séance offerte"),
                h("div", { style: { fontSize: 11, color: "#888", marginTop: 2 } }, `Cours d'essai · ${offertes.map(d => fmtDateCourt(d.date)).join(" · ")}`)),
              h("td", { style: { padding: "12px", textAlign: "right", color: "#444" } }, `${offertes.length * 2} h`),
              h("td", { style: { padding: "12px", textAlign: "right", color: "#444" } }, "offert"),
              h("td", { style: { padding: "12px", textAlign: "right", fontWeight: 700, color: C.navy } }, euros(0))) : null
          )
        ),

        // Les versements déjà reçus se déduisent ici comme sur le PDF : les deux
        // documents d'une même facture ne doivent jamais annoncer deux sommes.
        (Number(facture.encaisse) || 0) > 0 && h("div", { style: { fontSize: 13, color: "#555", textAlign: "right", marginBottom: 6, lineHeight: 1.7 } },
          h("div", null, "Total ", h("b", null, euros(facture.montant))),
          h("div", { style: { color: "#2e7d4f" } }, "Déjà réglé − ", euros(Number(facture.encaisse) || 0))),
        h("div", { style: { background: C.navy, borderRadius: 10, padding: "14px 18px", display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 } },

          h("span", { style: { color: C.goldVif, fontSize: 28, fontWeight: 700, fontFamily: FD } },

        ),

        h("div", { style: { fontSize: 11, color: "#666", textAlign: "right", marginBottom: 18, fontStyle: "italic" } },
          p.mention_tva || "TVA non applicable, article 293 B du CGI"),

        h("div", { style: { fontSize: 12, color: "#555", borderTop: "1px solid #eee", paddingTop: 12, lineHeight: 1.7 } },
          h("div", null, h("span", { style: { fontWeight: 700, color: "#333" } }, "Règlement : "), eleve.mp,
            facture.statut === "paye" && h("span", { style: { color: "#2e7d4f", fontWeight: 700, marginLeft: 8 } },
              "✅ Payée", facture.datePaiement ? ` le ${new Date(facture.datePaiement).toLocaleDateString("fr-FR")}` : "", ` (${facture.mode})`)),
          p.delai_paiement ? h("div", null, p.delai_paiement) : null,
          lienPaiementValide(facture) ? h("a", {
            href: lienPaiementValide(facture), target: "_blank", rel: "noopener noreferrer",
            style: { display: "block", marginTop: 8, background: "#fdf8e8", borderLeft: `3px solid ${C.goldVif}`, borderRadius: 6,
                     padding: "8px 10px", fontSize: 12, fontWeight: 700, color: "#0a1428", textDecoration: "none" }
          }, "💳 Payer en ligne par carte bancaire",
            h("div", { style: { fontSize: 10.5, fontWeight: 400, color: "#666", wordBreak: "break-all" } }, lienPaiementValide(facture))) : null,
          (p.iban && facture.statut !== "paye") ? h("div", { style: { marginTop: 8, background: "#f8f8f6", borderRadius: 6, padding: "8px 10px", fontSize: 11, lineHeight: 1.6 } },
            h("div", { style: { fontWeight: 700, color: "#333" } }, "Coordonnées bancaires"),
            p.titulaire_compte ? h("div", null, p.titulaire_compte) : null,
            h("div", null, "IBAN ", p.iban),
            p.bic ? h("div", null, "BIC ", p.bic) : null) : null,
          facture.notes ? h("div", { style: { marginTop: 6, fontStyle: "italic", color: "#888" } }, facture.notes) : null
        ),

        // Mentions de pied de facture : pénalités, escompte, identité complète.
        h("div", { style: { marginTop: 18, paddingTop: 12, borderTop: "1px solid #f0f0f0" } },
          [
            p.penalites_retard,
            p.escompte,
            [raisonSociale || "Boost'Étude", mentionEI, p.siret ? "SIRET " + p.siret : null, p.ape ? "APE " + p.ape : null]
              .filter(Boolean).join(" · ")
          ].filter(Boolean).map(ligneGrise)
        )
      )
    )
  );
}
// ─── MODULE FACTURATION ──────────────────────────────────────
function ModuleFacturation({
  eleves,
  groupes,
  appels,
  factures,
  onSaveFacture,
  onDeleteFacture,
  onDeleteFactureEnCours,
  parametres,
  onEmettreFacture,
  onRecharger,
  encaissements,
  onAjouterVersement,
  onSupprimerVersement,
  onAnnulerFacture,
  onRetablirFacture,
  onRelancer,
  ongletInitial
}) {
  const [onglet, setOnglet] = useState(ongletInitial || "encours");
  const [envoiEnCours, setEnvoiEnCours] = useState(null);
  const [modal, setModal] = useState(null); // {e,f,dates}
  const [impression, setImpression] = useState(null); // {f,e}
  const [toast, setToast] = useState(null);
  const [suppression, setSuppression] = useState(false);
  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  };
  const eleveDe = eid => eleves.find(x => x.id === eid);
  // Ne reste à enregistrer que la note : le montant vient de l'appel, et le statut
  // se déduit des versements.
  const handleSave = async data => {
    await onSaveFacture(modal.f?.id || null, modal.e.id, { ...modal.f, ...data });
  };
  const encaissementsDe = fid => (encaissements || []).filter(e => e.factureId === fid);
  // Renvoie true si la suppression a bien eu lieu (permet d'attendre la confirmation
  // avant de fermer une vue, ex. la fiche d'impression, sans la fermer si on annule).
  const handleDelete = async factureId => {
    // Garde-fou : une facture numérotée ne disparaît jamais (trou dans la
    // numérotation, versements effacés en cascade, présences supprimées).
    const emise = factures.find(f => f.id === factureId && f.numero);
    if (emise) {
      signalerErreur(`La facture ${emise.numero} est émise : elle ne se supprime pas (son numéro doit rester dans la séquence). Utilisez « Annuler » dans Factures → Gérer.`);
      return false;
    }
    const payee = factures.find(f => f.id === factureId && (Number(f.encaisse) > 0 || f.statut === "paye"));
    if (payee) {
      signalerErreur("Cette facture a reçu des versements : retirez-les d'abord (Encaisser → la croix). Ils figurent au livre des recettes.");
      return false;
    }
    if (!window.confirm("Supprimer définitivement cette facture ? Cette action est irréversible.")) return false;
    setSuppression(true);
    let ok = false;
    try {
      await onDeleteFacture(factureId);
      showToast("Facture supprimée ✓");
      ok = true;
    } catch (e) {
      signalerErreur(e);
    }
    setSuppression(false);
    return ok;
  };
  // Une facture "en cours" est entièrement recalculée depuis l'appel : supprimer seulement
  // la ligne facture ne suffit pas, le même montant réapparaîtrait aussitôt. On retire donc
  // aussi les séances présentes sous-jacentes (utile pour nettoyer un test, par exemple).
  const handleDeleteEnCours = async (factureId, eleveId, dates) => {
    const emise = factures.find(f => f.id === factureId && f.numero);
    if (emise) {
      signalerErreur(`La facture ${emise.numero} est émise : elle ne se supprime pas (son numéro doit rester dans la séquence). Utilisez « Annuler » dans Factures → Gérer.`);
      return false;
    }
    const payee = factures.find(f => f.id === factureId && (Number(f.encaisse) > 0 || f.statut === "paye"));
    if (payee) {
      signalerErreur("Cette facture a reçu des versements : retirez-les d'abord (Encaisser → la croix). Ils figurent au livre des recettes.");
      return false;
    }
    if (!window.confirm("Supprimer ces séances de l'appel et la facture en cours associée ? Cette action retire ces séances de l'historique de présence et est irréversible.")) return false;
    setSuppression(true);
    let ok = false;
    try {
      await onDeleteFactureEnCours(factureId, eleveId, dates);
      showToast("Facture en cours supprimée ✓");
      ok = true;
    } catch (e) {
      signalerErreur(e);
    }
    setSuppression(false);
    return ok;
  };
  // Émettre puis partager, sans repasser par l'écran de la facture.
  const emettreEtEnvoyer = async (f, el) => {
    const manquants = champsManquants(parametres);
    if (manquants.length) {
      signalerErreur({ message: "Complétez d'abord vos informations légales dans Réglages : " + manquants.join(", ") });
      return;
    }
    // Une seule confirmation, parce qu'une facture émise reçoit un numéro définitif :
    // la séquence comptable ne tolère ni trou ni doublon, on ne défait pas une émission.
    if (!window.confirm(`Émettre la facture de ${el.prenom} (${f.montant} €) et l'envoyer au parent ?\n\nElle recevra un numéro définitif et son montant sera figé.`)) return;

    // Le partage système (menu « Partager ») sait joindre le PDF, mais il demande
    // ensuite à qui l'envoyer : à dix-huit élèves, c'est dix-huit occasions de se
    // tromper de conversation. Un lien wa.me, lui, ouvre directement la discussion
    // du parent — mais ne transporte aucun fichier. On ouvre donc la bonne
    // conversation, et le PDF se joint ensuite d'un geste, depuis la carte.
    const tel = (el.tel || "").replace(/\s/g, "");
    // La fenêtre doit être réservée AVANT l'attente : après un `await`, le
    // téléphone considère le geste expiré et bloque l'ouverture.
    const fenetre = tel ? window.open("", "_blank") : null;

    setEnvoiEnCours(f.id);
    try {
      const numero = await onEmettreFacture(f.id, { recharger: false });
      const emise = { ...f, numero: numero || f.numero, dateEmission: todayStr() };

      if (tel) {
        // La fenêtre est déjà réservée : on peut prendre le temps de demander le
        // lien de paiement par carte. S'il ne vient pas (clé Stripe absente, réseau),
        // la facture part quand même, avec les moyens habituels.
        let lienCarte = null, sansCarte = "";
        try {
          lienCarte = (await api.lienPaiement(emise.id)).url;
        } catch (err) {
          sansCarte = err && err.message ? err.message : "lien indisponible";
        }
        const texte = makeFactureWhatsApp(el, emise.numero, f.nbSeances, f.montant, f.datesSeances, seuil, f.prestation, lienCarte);
        const lien = `https://wa.me/${telWhatsApp(tel)}?text=${encodeURIComponent(texte)}`;
        if (fenetre) fenetre.location = lien;
        else window.open(lien, "_blank", "noopener,noreferrer");
        if (lienCarte) signalerSucces(`Facture ${emise.numero} émise, avec son lien de paiement par carte — WhatsApp s'ouvre sur ${el.parent || "le parent"}. Le PDF se joint depuis la carte.`);
        else signalerInfo(`Facture ${emise.numero} émise — WhatsApp s'ouvre sur ${el.parent || "le parent"}, sans lien carte (${sansCarte}).`);
      } else {
        // Ici le partage système doit partir dans la foulée du clic : pas de détour
        // par le serveur, la facture part avec les moyens habituels.
        const texte = makeFactureWhatsApp(el, emise.numero, f.nbSeances, f.montant, f.datesSeances, seuil, f.prestation);
        // Sans numéro de parent, le partage système reste le seul chemin.
        const r = await partagerFacturePDF(emise, el, parametres, texte);
        if (r.telecharge) signalerInfo(`Facture ${emise.numero} émise, PDF téléchargé — cet appareil ne sait pas partager de fichier.`);
        else if (r.partage) signalerSucces(`Facture ${emise.numero} envoyée.`);
        else signalerInfo(`Facture ${emise.numero} émise. Ajoutez le téléphone du parent pour l'envoyer en un geste.`);
      }
    } catch (e) {
      if (fenetre) fenetre.close();
      // L'autorisation de partage a expiré : la facture est bien émise, il suffit de
      // la renvoyer depuis sa fiche. On le dit au lieu de laisser croire à un échec.
      if (e && e.name === "NotAllowedError") signalerInfo("Facture émise. Ouvrez-la pour la partager.");
      else signalerErreur(e);
    }
    setEnvoiEnCours(null);
    if (onRecharger) await onRecharger();
  };

  const actifs = eleves.filter(e => e.actif !== false);
  // Ouverte = ni soldée ni annulée. Une facture annulée n'est plus due.
  const ouvertes = factures.filter(f => f.statut !== "paye" && f.statut !== "annulee");
  // Seuil de signalement, réglable dans Réglages (trois séances par défaut).
  const seuil = Math.max(1, parseInt(parametres?.seuil_facturation, 10) || SEUIL_FACTURATION_DEFAUT);
  // À facturer : la facture a atteint le seuil et n'a pas encore de numéro.
  const aFacturer = ouvertes
    // Un forfait de stage se facture d'un bloc : il est à envoyer dès sa création.
    .filter(f => !f.numero && (f.stageId || (f.nbSeances || 0) >= seuil) && actifs.find(e => e.id === f.eleveId))
    .sort((a, b) => (b.nbSeances || 0) - (a.nbSeances || 0));
  // Ce qui reste à encaisser sur des factures déjà parties chez les parents.
  const nbARelancer = aRelancer(factures, actifs).length;

    const emise = !!f.numero;
    const annulee = f.statut === "annulee";
    const verse = Number(f.encaisse) || 0;
    const occupe = envoiEnCours === f.id;

    // Ouvrir la conversation du parent, directement sur son numéro : aucun risque
    // de se tromper de destinataire dans la liste des contacts.
    const whatsappParent = () => {
      const tel = (e.tel || "").replace(/\s/g, "");
      if (!tel) {
        signalerErreur({ message: `Pas de téléphone parent pour ${e.prenom} : ajoutez-le dans sa fiche.` });
        return;
      }
      const texte = makeFactureWhatsApp(e, f.numero, f.nbSeances, f.montant, f.datesSeances, seuil, f.prestation, lienPaiementValide(f));
      window.open(`https://wa.me/${telWhatsApp(tel)}?text=${encodeURIComponent(texte)}`, "_blank", "noopener,noreferrer");
    };

    // Joindre le PDF : le partage système, une fois la conversation ouverte.
    const partager = async () => {
      setEnvoiEnCours(f.id);
      try {
        const texte = makeFactureWhatsApp(e, f.numero, f.nbSeances, f.montant, f.datesSeances, seuil, f.prestation, lienPaiementValide(f));
        const r = await partagerFacturePDF(f, e, parametres, texte);
        if (r.telecharge) signalerInfo("PDF téléchargé — cet appareil ne sait pas partager de fichier.");
        else if (r.partage) signalerSucces(`Facture ${f.numero} envoyée.`);
      } catch (err) {
        signalerErreur(err);
      }
      setEnvoiEnCours(null);
    };

    const annuler = async () => {
      const motif = window.prompt(
        `Annuler la facture ${f.numero} de ${e ? e.prenom : "cet élève"} ?\n\n` +
        "Elle gardera son numéro — la numérotation comptable ne tolère pas de trou — " +
        "mais sortira du chiffre d'affaires, et ses séances redeviendront facturables.\n\n" +
        "Motif (facultatif) :", "");
      if (motif === null) return;
      try {
        await onAnnulerFacture(f.id, motif);
        signalerSucces(`Facture ${f.numero} annulée.`);
      } catch (err) {
        signalerErreur(err);
      }
    };

    const retablir = async () => {
      try {
        await onRetablirFacture(f.id);
        signalerSucces(verse > 0 ? "Facture rétablie." : "Facture remise en attente de règlement.");
      } catch (err) {
        signalerErreur(err);
      }
    };

    const bouton = (libelle, onClick, couleur, fond, bord) => h("button", {
      onClick, disabled: occupe,
      style: {
        flex: 1, background: fond, border: `1px solid ${bord}`, borderRadius: 9,
        padding: "9px 6px", color: couleur, fontSize: 12.5, fontWeight: 700,
        cursor: occupe ? "wait" : "pointer", fontFamily: "inherit", whiteSpace: "nowrap"
      }
    }, libelle);

    return h("div", {
      key: f.id,
      style: {
        background: C.surface, border: `1px solid ${C.bord}`, boxShadow: C.ombre,
        borderRadius: 12, padding: 14, opacity: annulee ? 0.68 : 1
      }
    },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, marginBottom: 10 } },
        h("div", { style: { minWidth: 0, flex: 1 } },
          h("div", { style: { fontSize: 14, fontWeight: 700, color: C.texte, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } },
            e ? `${e.prenom} ${e.nom}` : "Élève introuvable",
            e && e.actif === false && h("span", {
              style: { marginLeft: 8, fontSize: 10, fontWeight: 700, color: C.red, background: C.redPale, padding: "2px 8px", borderRadius: 20 }
            }, "inactif")),
          h("div", { style: { fontSize: 11, color: C.gray, marginTop: 2 } },
            periode, " • ", f.nbSeances, " séance", f.nbSeances > 1 ? "s" : "",
            verse > 0 ? h("span", { style: { color: C.green } }, ` • ${euros(verse)} versés`) : null)),
        h("div", { style: { textAlign: "right", flexShrink: 0 } },
          h(StatutBadge, { statut: f.statut }),
          h("div", {
            style: {
              fontSize: 15, fontWeight: 800, fontFamily: FD, marginTop: 4,
              color: annulee ? C.gray : C.gold,
              textDecoration: annulee ? "line-through" : "none"
            }
          }, euros(f.montant)))),

      h("div", { style: { display: "flex", gap: 6 } },
        annulee
          ? bouton("↩️ Rétablir", retablir, C.gold, C.goldPale, C.goldBord)
          : [
              emise && e ? h(React.Fragment, { key: "env" },
                bouton("💬 WhatsApp", whatsappParent, "#0b6b37", C.whatsappPale, C.whatsappBord)) : null,
              emise && e ? h(React.Fragment, { key: "pdf" },
                bouton(occupe ? "…" : "📎 PDF", partager, C.texte, C.surface2, C.bord)) : null,
              e ? h(React.Fragment, { key: "enc" },
                bouton("💰 Encaisser", () => setModal({ e, f, dates: f.datesSeances || [] }),
                  C.green, C.greenPale, C.greenBord)) : null,
              emise
                ? h(React.Fragment, { key: "ann" },
                    bouton("↩️ Annuler", annuler, C.gray, C.surface2, C.bord))
                : h(React.Fragment, { key: "sup" },
                    bouton("🗑 Supprimer", () => handleDeleteToutes(f), C.red, C.redPale, C.redBord))
            ]),

      // Dire pourquoi une facture émise ne se supprime pas évite de chercher le bouton.
      emise && !annulee && h("div", { style: { fontSize: 10.5, color: C.grisClair, marginTop: 8, lineHeight: 1.5 } },
        "Une facture émise ne se supprime pas : son numéro doit rester dans la séquence. L'annuler la sort du chiffre d'affaires et libère ses séances.")
    );
  }))));
}
// ─── RELANCES ────────────────────────────────────────────────
// « L'envoi des factures et le suivi, la relance » — c'est ce qui pèse le plus.
// L'envoi tient désormais en un geste ; restait la relance, qui demandait de se
// souvenir de qui doit quoi depuis quand.
//
// Cet écran ne montre que les factures émises qu'il reste à encaisser, les plus
// anciennes d'abord, avec le nombre de jours écoulés et la date de la dernière
// relance — pour ne harceler personne et n'oublier personne.

const JOURS_TIEDE = 7;
const JOURS_CHAUD = 15;

const joursDepuis = iso => {
  if (!iso) return 0;
  // Écart en jours de calendrier, compté en UTC pur : ni le fuseau ni le
  // passage à l'heure d'été (journée de 23 h) ne peuvent décaler le compte.
  const [a, m, j] = String(iso).slice(0, 10).split("-").map(Number);
  const debut = Date.UTC(a, m - 1, j);
  if (isNaN(debut)) return 0;
  const n = new Date();
  const auj = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.max(0, Math.round((auj - debut) / 86400000));
};

const tonRelance = jours =>
  jours >= JOURS_CHAUD ? { cl: C.red, bg: C.redPale, bd: C.redBord }
  : jours >= JOURS_TIEDE ? { cl: C.orange, bg: C.orangePale, bd: C.orangeBord }
  : { cl: C.gray, bg: C.surface, bd: C.bord };

// Les factures à relancer : émises, pas annulées, et pas encore soldées.
const aRelancer = (factures, eleves) => (factures || [])
  .filter(f => f.numero && f.statut !== "annulee" && resteDu(f) > 0 && eleves.find(e => e.id === f.eleveId))
  .map(f => ({ f, jours: joursDepuis(f.dateEmission), reste: resteDu(f) }))
  .sort((a, b) => b.jours - a.jours);

function ModuleRelances({ eleves, factures, parametres, onRelancer }) {
  const [enCours, setEnCours] = useState(null);
  const liste = aRelancer(factures, eleves);
  const total = liste.reduce((s, x) => s + x.reste, 0);
  const eleveDe = id => eleves.find(e => e.id === id);

  const relancer = async (f, el, canal) => {
    const reste = resteDu(f);
    const tel = telWhatsApp((el.tel || "").replace(/\s/g, ""));
    const fabriquer = lienCarte => {
      const texte = makeRappelWhatsApp(el, f.numero, reste, f.datesSeances, Number(f.encaisse) || 0, lienCarte);
      return canal === "sms"
        ? `sms:${(el.tel || "").replace(/\s/g, "")}?body=${encodeURIComponent(texte)}`
        : `https://wa.me/${tel}?text=${encodeURIComponent(texte)}`;
    };
    const lienConnu = lienPaiementValide(f);
    if (lienConnu || canal === "sms") {
      // On ouvre la conversation d'abord : l'autorisation du geste ne dure qu'un instant.
      window.open(fabriquer(lienConnu), "_blank", "noopener,noreferrer");
    } else {
      // Pas encore de lien au bon montant (acompte reçu, facture d'avant Stripe) :
      // on réserve la fenêtre tout de suite, puis on demande un lien neuf.
      const fenetre = window.open("", "_blank");
      let lienCarte = null;
      try { lienCarte = (await api.lienPaiement(f.id)).url; } catch (_) { /* relance sans carte */ }
      if (fenetre) fenetre.location = fabriquer(lienCarte);
      else window.open(fabriquer(lienCarte), "_blank", "noopener,noreferrer");
    }
    setEnCours(f.id);
    try {
      await onRelancer(f.id);
      signalerSucces(`Relance notée pour ${el.prenom}.`);
    } catch (e) {
      signalerErreur(e);
    }
    setEnCours(null);
  };

  if (liste.length === 0) {
    return h("div", { style: { textAlign: "center", padding: "40px 20px", color: C.gray } },
      h("div", { style: { fontSize: 36, marginBottom: 12 } }, "✅"),
      h("div", { style: { fontSize: 15, fontWeight: 700, color: C.texte, fontFamily: FD, marginBottom: 6 } },
        "Rien à relancer"),
      h("div", { style: { fontSize: 13, lineHeight: 1.6, maxWidth: 300, margin: "0 auto" } },
        "Toutes les factures émises sont réglées. Les factures en brouillon n'apparaissent pas ici : il faut d'abord les émettre."));
  }

  return h("div", null,
    h("div", {
      style: {
        background: C.orangePale, border: `1px solid ${C.orangeBord}`,
        borderRadius: 14, padding: 14, marginBottom: 14
      }
    },
      h("div", { style: { fontSize: 22, fontWeight: 800, color: C.orange, fontFamily: FD } }, euros(total)),
      h("div", { style: { fontSize: 12.5, color: C.gray, marginTop: 2 } },
        `en attente sur ${liste.length} facture${liste.length > 1 ? "s" : ""} — les plus anciennes d'abord`)),

    h("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
      liste.map(({ f, jours, reste }) => {
        const el = eleveDe(f.eleveId);
        const ton = tonRelance(jours);
        const occupe = enCours === f.id;
        const relanceJours = f.derniereRelance ? joursDepuis(f.derniereRelance) : null;
        return h("div", {
          key: f.id,
          style: { background: ton.bg, border: `1px solid ${ton.bd}`, borderRadius: 14, padding: 14 }
        },
          h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, marginBottom: 10 } },
            h("div", { style: { minWidth: 0, flex: 1 } },
              h("div", { style: { fontSize: 15, fontWeight: 700, color: C.texte, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } },
                `${el.prenom} ${el.nom}`),
              h("div", { style: { fontSize: 11.5, color: C.gray, marginTop: 3, lineHeight: 1.5 } },
                f.numero, " • émise il y a ",
                h("span", { style: { color: ton.cl, fontWeight: 700 } }, `${jours} jour${jours > 1 ? "s" : ""}`),
                (Number(f.encaisse) || 0) > 0
                  ? h("span", { style: { color: C.green } }, ` • ${euros(f.encaisse)} déjà versés`)
                  : null),
              relanceJours !== null
                ? h("div", { style: { fontSize: 11, color: C.grisClair, marginTop: 3 } },
                    relanceJours === 0 ? "🔔 relancé aujourd'hui"
                      : `🔔 relancé il y a ${relanceJours} jour${relanceJours > 1 ? "s" : ""}`)
                : h("div", { style: { fontSize: 11, color: C.grisClair, marginTop: 3 } }, "jamais relancé")),
            h("div", { style: { fontSize: 19, fontWeight: 800, color: ton.cl, fontFamily: FD, whiteSpace: "nowrap" } },
              euros(reste))),

          el.tel
            ? h("div", { style: { display: "flex", gap: 6 } },
                h("button", {
                  onClick: () => relancer(f, el, "whatsapp"),
                  disabled: occupe,
                  style: {
                    flex: 2, background: C.whatsappPale, border: `1px solid ${C.whatsappBord}`,
                    borderRadius: 9, padding: "10px 8px", color: "#25d366", fontSize: 13,
                    fontWeight: 700, cursor: occupe ? "wait" : "pointer", fontFamily: "inherit"
                  }
                }, occupe ? "…" : "💬 Relancer par WhatsApp"),
                h("button", {
                  onClick: () => relancer(f, el, "sms"),
                  disabled: occupe,
                  style: {
                    flex: 1, background: C.bluePale, border: `1px solid ${C.blueBord}`,
                    borderRadius: 9, padding: "10px 8px", color: C.blue, fontSize: 13,
                    fontWeight: 700, cursor: occupe ? "wait" : "pointer", fontFamily: "inherit"
                  }
                }, "📱 SMS"))
            : h("div", { style: { fontSize: 12, color: C.gray, fontStyle: "italic" } },
                "Pas de téléphone parent : ajoutez-le dans la fiche de l'élève."));
      })));
}
// ─── STAGES DE VACANCES ──────────────────────────────────────
// Un stage ne se compte pas en séances : il se vend au forfait, sur une semaine
// de vacances, à un groupe constitué pour l'occasion. Il lui fallait donc son
// propre écran — mais surtout pas sa propre facturation : inscrire un élève crée
// une facture ordinaire, qui repart dans Factures avec sa numérotation, ses
// versements, ses relances et son envoi en un clic.

// Les trois forfaits de l'offre. Le champ reste libre : un stage plus court ou
// plus long se chiffre à la main sans toucher au code.
const FORFAITS_STAGE = [149, 189, 229];

const etatStage = s => {
  const t = todayStr();
  if (s.dateFin && s.dateFin < t) return { k: "termine", l: "Terminé", cl: C.gray, bg: C.surface, bd: C.bord };
  if (s.dateDebut && s.dateDebut > t) return { k: "avenir", l: "À venir", cl: C.blue, bg: C.surface, bd: C.blueBord };
  return { k: "encours", l: "En cours", cl: C.green, bg: C.surface, bd: C.greenBord };
};

const periodeStage = s => {
  if (!s.dateDebut) return "Dates à définir";
  if (!s.dateFin || s.dateFin === s.dateDebut) return fmtDateLongue(s.dateDebut);
  return `${fmtDateCourt(s.dateDebut)} → ${fmtDateLongue(s.dateFin)}`;
};

// L'argent d'un stage : ce que valent les inscriptions, ce qui est déjà facturé,
// ce qui est rentré. Une facture annulée ne compte pas — et rend l'inscription
// de nouveau facturable, sinon une erreur de saisie serait sans retour.
const bilanStage = (stage, inscrits, factures) => {
  const ins = (inscrits || []).filter(i => i.stageId === stage.id);
  const fs = (factures || []).filter(f => f.stageId === stage.id && f.statut !== "annulee");
  const attendu = ins.reduce((s, i) => s + (Number(i.tarif) || 0), 0);
  const facture = fs.reduce((s, f) => s + (Number(f.montant) || 0), 0);
  const encaisse = fs.reduce((s, f) => s + (Number(f.encaisse) || 0), 0);
  const aFacturer = ins.filter(i => !i.factureId || !fs.find(f => f.id === i.factureId));
  return {
    ins, attendu, facture, encaisse,
    reste: Math.max(0, Math.round((facture - encaisse) * 100) / 100),
    aFacturer
  };
};

// ── Formulaire ───────────────────────────────────────────────
function FormulaireStage({ initial, onSave, onCancel }) {
  const def = initial || {
    nom: "", niveau: "3ème", matiere: "Mathématiques",
    dateDebut: todayStr(), dateFin: todayStr(), horaire: "10h–12h",
    tarif: 189, places: 8, notes: ""
  };
  const [nom, setNom] = useState(def.nom);
  const [niveau, setNiveau] = useState(def.niveau || "3ème");
  const [matiere, setMatiere] = useState(def.matiere || "Mathématiques");
  const [dateDebut, setDateDebut] = useState(def.dateDebut || todayStr());
  const [dateFin, setDateFin] = useState(def.dateFin || todayStr());
  const [horaire, setHoraire] = useState(def.horaire || "");
  const [tarif, setTarif] = useState(String(def.tarif ?? 189));
  const [places, setPlaces] = useState(String(def.places ?? 8));
  const [notes, setNotes] = useState(def.notes || "");
  const [saving, setSaving] = useState(false);

  const tarifNum = Number(String(tarif).replace(",", ".")) || 0;
  const datesIncoherentes = dateDebut && dateFin && dateFin < dateDebut;
  const pret = nom.trim() && dateDebut && dateFin && !datesIncoherentes && tarifNum > 0;

  const save = async () => {
    setSaving(true);
    try {
      await onSave({
        id: initial?.id, nom: nom.trim(), niveau, matiere,
        dateDebut, dateFin, horaire: horaire.trim(),
        tarif: tarifNum, places: Number(places) || 8, notes: notes.trim()
      });
    } finally {
      setSaving(false);
    }
  };

  return h(Feuille, { titre: initial?.id ? "Modifier le stage" : "Nouveau stage" },
    h(InputText, {
      label: "Nom du stage *", value: nom, onChange: setNom,
      placeholder: "Stage Toussaint — révisions brevet"
    }),
    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 } },
      h(SelectInput, { label: "Niveau", value: niveau, onChange: setNiveau, options: NIVEAUX }),
      h(SelectInput, { label: "Matière", value: matiere, onChange: setMatiere, options: MATIERES })),
    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 } },
      h(InputText, { label: "Du *", value: dateDebut, onChange: setDateDebut, type: "date" }),
      h(InputText, { label: "Au *", value: dateFin, onChange: setDateFin, type: "date" })),
    datesIncoherentes
      ? h("div", { style: { fontSize: 12.5, color: C.red, marginTop: -6, marginBottom: 12 } },
          "La date de fin précède la date de début.")
      : null,
    h(InputText, { label: "Horaire", value: horaire, onChange: setHoraire, placeholder: "10h–12h et 14h–16h" }),

    h(Lbl, { text: "Forfait par élève *" }),
    h("div", { style: { display: "flex", gap: 6, marginBottom: 10 } },
      FORFAITS_STAGE.map(v => h("button", {
        key: v,
        onClick: () => setTarif(String(v)),
        style: {
          flex: 1,
          background: tarifNum === v ? C.navy : C.surface,
          border: `1px solid ${tarifNum === v ? C.navy : C.bord}`,
          borderRadius: 10, padding: "10px 4px",
          color: tarifNum === v ? "#fff" : C.texte,
          fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit"
        }
      }, `${v} €`))),
    h(InputText, { label: null, value: tarif, onChange: setTarif, placeholder: "189" }),

    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 } },
      h(InputText, { label: "Places", value: places, onChange: setPlaces, type: "number" }),
      h("div", { style: { marginBottom: 14 } },
        h(Lbl, { text: "Recette si complet" }),
        h("div", {
          style: {
            padding: "11px 12px", borderRadius: 10, background: C.navyPale,
            border: `1px solid ${C.bord}`, color: C.gold, fontWeight: 700,
            fontSize: 15, fontFamily: FD
          }
        }, euros(tarifNum * (Number(places) || 0))))),
    h(InputArea, { label: "Notes", value: notes, onChange: setNotes, placeholder: "Programme, salle, matériel…" }),

    h("div", { style: { display: "flex", gap: 10, marginTop: 6 } },
      h(BtnSecondary, { label: "Annuler", onClick: onCancel, full: true }),
      h(BtnPrimary, { label: saving ? "…" : initial?.id ? "Enregistrer" : "Créer le stage", onClick: save, disabled: !pret || saving, full: true })));
}

// ── Inscription d'un élève ───────────────────────────────────
function ChoixEleve({ stage, eleves, dejaInscrits, onInscrire, onCancel }) {
  const [recherche, setRecherche] = useState("");
  const [tarif, setTarif] = useState(String(stage.tarif));
  const [enCours, setEnCours] = useState(null);

  const q = recherche.trim().toLowerCase();
  const dispo = (eleves || [])
    .filter(e => !dejaInscrits.includes(e.id))
    .filter(e => !q || `${e.prenom} ${e.nom} ${e.niveau}`.toLowerCase().includes(q))
    .sort((a, b) => (a.nom || "").localeCompare(b.nom || ""));

  const inscrire = async el => {
    setEnCours(el.id);
    try {
      await onInscrire(stage.id, el.id, Number(String(tarif).replace(",", ".")) || stage.tarif);
      signalerSucces(`${el.prenom} est inscrit au stage.`);
    } catch (e) {
      signalerErreur(e);
    }
    setEnCours(null);
  };

  return h(Feuille, { titre: "Inscrire au stage", sousTitre: stage.nom },
    h(InputText, { label: "Forfait appliqué", value: tarif, onChange: setTarif, placeholder: String(stage.tarif) }),
    h("div", { style: { fontSize: 12.5, color: C.gray, marginTop: -8, marginBottom: 14, lineHeight: 1.5 } },
      "Modifiable avant chaque inscription — pour une remise fratrie ou un stage partiel."),
    h(InputText, { label: "Rechercher", value: recherche, onChange: setRecherche, placeholder: "Nom de l'élève" }),

    dispo.length === 0
      ? h("div", { style: { fontSize: 13.5, color: C.gray, textAlign: "center", padding: "20px 10px" } },
          q ? "Aucun élève ne correspond." : "Tous les élèves sont déjà inscrits.")
      : h("div", { style: { display: "flex", flexDirection: "column", gap: 6, maxHeight: 340, overflowY: "auto" } },
          dispo.map(el => h("button", {
            key: el.id,
            onClick: () => inscrire(el),
            disabled: enCours === el.id,
            style: {
              display: "flex", alignItems: "center", gap: 10, textAlign: "left",
              background: C.surface, border: `1px solid ${C.bord}`,
              borderRadius: 10, padding: "9px 11px", cursor: "pointer", fontFamily: "inherit",
              color: C.texte, opacity: enCours === el.id ? 0.5 : 1
            }
          },
            h(Avatar, { p: el.prenom, n: el.nom, s: 32 }),

// Téléchargement d'un fichier produit dans le navigateur.
// Le point-virgule et le BOM sont ce qu'attend un Excel français : sans eux,
// les accents sont illisibles et tout atterrit dans une seule colonne.
const telechargerFichier = (nom, contenu, type) => {
  const blob = new Blob([contenu], { type: type || "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

const versCSV = (colonnes, lignes) => {
  const cellule = v => {
    const s = v === null || v === undefined ? "" : String(v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return "﻿" + [colonnes.map(c => cellule(c.titre)).join(";")]
    .concat(lignes.map(l => colonnes.map(c => cellule(c.valeur(l))).join(";")))
    .join("\r\n");
};

// Le livre des recettes d'un micro-entrepreneur enregistre l'ARGENT REÇU, à la
// date où il est reçu — c'est aussi ce chiffre qui se déclare à l'URSSAF. Il se

// des factures soldées : un acompte, une facture réglée en deux mois ou un
// brouillon encaissé sans numéro en auraient disparu.
const lignesRecettes = (encaissements, factures) => {
  const factureDe = id => (factures || []).find(f => f.id === id);
  const lignes = (encaissements || []).map(e => ({ id: e.id, date: e.date, montant: Number(e.montant) || 0, mode: e.mode, facture: factureDe(e.factureId) }));
  // Factures soldées avant l'arrivée des versements (2.4.0) : une ligne chacune.
  const avecVersement = new Set((encaissements || []).map(e => e.factureId));
  (factures || []).filter(f => f.statut === "paye" && f.datePaiement && !avecVersement.has(f.id))
    .forEach(f => lignes.push({ id: "f-" + f.id, date: f.datePaiement, montant: Number(f.montant) || 0, mode: f.mode, facture: f }));
  return lignes.filter(l => l.date).sort((a, b) => a.date.localeCompare(b.date));
};
