// ─── RÉMUNÉRATION DES PROFESSEURS ────────────────────────────
// Deux comptes sortent de la même feuille d'appel, et il ne faut pas les
// confondre : le parent paie les séances où son enfant était présent ; le
// professeur est payé pour la séance qu'il a assurée, même si deux élèves
// manquaient. C'est la séance qui est due, pas la tête des élèves.
//
// Conséquence directe, à redire aux professeurs : une séance dont l'appel n'a
// pas été fait n'existe nulle part — ni facturée au parent, ni rémunérée.

const TAUX_HORAIRE_DEFAUT = 25;
const HEURES_PAR_SEANCE = 2;

// Les séances effectivement assurées dans le mois, par professeur. Une clé
// d'appel vide (cours créé, appel jamais enregistré) ne compte pas : rien ne
// prouve que la séance a eu lieu.
const seancesDuMois = (profId, ym, appels, groupes) => {
  const siens = (groupes || []).filter(g => g.profId === profId).map(g => g.id);
  if (siens.length === 0) return [];
  return Object.entries(appels || {})
    .filter(([cle, presences]) => {
      const [tag, groupeId, date] = cle.split(":");
      if (tag !== "ap" || !date || !date.startsWith(ym) || estFuture(date)) return false;
      if (!siens.includes(groupeId)) return false;
      return Object.values(presences || {}).some(Boolean);
    })
    .map(([cle]) => {
      const [, groupeId, date] = cle.split(":");
      const g = (groupes || []).find(x => x.id === groupeId);
      return {
        date, groupeId,
        groupe: g ? g.nom : "Groupe supprimé",
        presents: Object.values(appels[cle] || {}).filter(v => v === "present").length
      };
    })
    .sort((a, b) => a.date.localeCompare(b.date));
};

// Un taux non renseigné vaut 25 €/h ; un taux volontairement mis à zéro reste
// à zéro — un professeur bénévole, cela existe.
const tauxDe = p => {
  if (!p || p.taux_horaire === null || p.taux_horaire === undefined || p.taux_horaire === "") {
    return TAUX_HORAIRE_DEFAUT;
  }
  const t = Number(p.taux_horaire);
  return Number.isFinite(t) && t >= 0 ? t : TAUX_HORAIRE_DEFAUT;
};

const duAuProf = (prof, ym, appels, groupes) => {
  const seances = seancesDuMois(prof.id, ym, appels, groupes);
  const heures = seances.length * HEURES_PAR_SEANCE;
  return { seances, heures, montant: Math.round(heures * tauxDe(prof) * 100) / 100 };
};

// Le récapitulatif qu'on envoie au professeur : ce qu'il a assuré, et ce qu'il
// touche. Détaillé, parce qu'un décompte qu'on ne peut pas vérifier se discute.
const makeRemunerationWhatsApp = (prof, ym, seances, heures, montant, taux) =>
  `*Boost'Étude — ${ml(ym)}*\n\n` +
  `Bonjour ${prof.prenom || ""},\n\n`.replace("  ", " ") +
  `Voici le récapitulatif de tes séances :\n` +
  seances.map(s => `• ${fmtDateCourt(s.date)} — ${s.groupe} (${s.presents} présent${s.presents > 1 ? "s" : ""})`).join("\n") +
  `\n\n` +
  `• ${seances.length} séance${seances.length > 1 ? "s" : ""} de ${HEURES_PAR_SEANCE} h, soit *${heures} h*\n` +
  `• ${montantTxt(taux)}/h\n` +
  `• *Total : ${montantTxt(montant)}*\n\n` +
  `Merci pour ton travail de ce mois-ci.\n` +
  `Fouad Elmkhanter — Boost'Étude`;

function OngletProfesseurs({ profs, groupes, appels, onSaveTaux, onSaveTel, moisInitial }) {
  const [mois, setMois] = useState(moisInitial || nowYM());
  const [edition, setEdition] = useState(null);   // { id, champ, valeur }
  const [deplie, setDeplie] = useState(null);
  const [envoi, setEnvoi] = useState(null);

  // L'exploitant ne figure pas parmi les rémunérations : en micro-entreprise, il
  // ne se verse pas de salaire — il prend le bénéfice. Ses heures restent
  // affichées à part, parce qu'elles disent la charge réelle de la semaine.
  const avecGroupes = p => (groupes || []).some(g => g.profId === p.id);
  const enseignants = (profs || [])
    .filter(p => p.role !== "admin" && avecGroupes(p))
    .map(p => ({ p, ...duAuProf(p, mois, appels, groupes) }))
    .sort((a, b) => b.montant - a.montant);

  const mesHeures = (profs || [])
    .filter(p => p.role === "admin" && avecGroupes(p))
    .reduce((s, p) => s + duAuProf(p, mois, appels, groupes).heures, 0);

  const total = enseignants.reduce((s, x) => s + x.montant, 0);

  const enregistrer = async prof => {
    try {
      if (edition.champ === "taux") {
        const valeur = Number(String(edition.valeur).replace(",", "."));
        if (!Number.isFinite(valeur) || valeur < 0) {
          signalerErreur({ message: "Entrez un taux horaire valide." });
          return;
        }
        await onSaveTaux(prof.id, valeur);
        signalerSucces(`${prof.prenom || "Ce professeur"} : ${montantTxt(valeur)}/h.`);
      } else {
        await onSaveTel(prof.id, edition.valeur);
        signalerSucces(edition.valeur.trim() ? "Numéro enregistré." : "Numéro retiré.");
      }
      setEdition(null);
    } catch (e) {
      signalerErreur(e);
    }
  };

  const envoyer = (prof, seances, heures, montant) => {
    const tel = String(prof.telephone || "").replace(/\s/g, "");
    const texte = makeRemunerationWhatsApp(prof, mois, seances, heures, montant, tauxDe(prof));
    if (tel) {
      window.open(`https://wa.me/${telWhatsApp(tel)}?text=${encodeURIComponent(texte)}`, "_blank", "noopener,noreferrer");
      return;
    }
    // Sans numéro en base, on copie : le message est prêt, il n'y a qu'à le coller.
    try {
      const champ = document.createElement("textarea");
      champ.value = texte;
      document.body.appendChild(champ);
      champ.select();
      document.execCommand("copy");
      champ.remove();
      setEnvoi(prof.id);
      setTimeout(() => setEnvoi(null), 2500);
      signalerInfo("Récapitulatif copié — collez-le dans WhatsApp.");
    } catch (e) {
      signalerErreur({ message: "Copie impossible sur cet appareil." });
    }
  };

  return h("div", null,
    h("div", { style: { fontSize: 13.5, color: C.gray, lineHeight: 1.6, marginBottom: 14 } },
      "Chaque séance dont l'appel a été enregistré compte ", h("strong", null, `${HEURES_PAR_SEANCE} heures`),
      ", quel que soit le nombre d'élèves présents. Une séance sans appel n'est ni facturée au parent, ni rémunérée."),

    h("div", { style: { display: "flex", gap: 6, marginBottom: 14, overflowX: "auto", paddingBottom: 2 } },
      lastMonths(6).map(m => h("button", {
        key: m,
        onClick: () => setMois(m),
        style: {
          background: mois === m ? C.navy : C.surface,
          color: mois === m ? "#fff" : C.gray,
          border: `1px solid ${mois === m ? C.navy : C.bord}`,
          borderRadius: 999, padding: "6px 13px", fontSize: 12.5, fontWeight: 600,
          cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap"
        }
      }, MOIS_C[+m.split("-")[1] - 1]))),

    enseignants.length === 0
      ? h(Vide, {
          icone: "👥", titre: "Aucun professeur à rémunérer",
          texte: "Attribuez un professeur à ses groupes dans l'onglet Appel — c'est ce lien qui permet de compter ses heures."
        })
      : h("div", null,
          h(Carte, { style: { marginBottom: 12 } },
            h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 10 } },
              h("div", { style: { fontSize: 13.5, color: C.gray } }, `À verser pour ${ml(mois)}`),
              h("div", { style: { fontSize: 24, fontWeight: 700, color: C.texte, fontFamily: FD } }, euros(total))),
            mesHeures > 0
              ? h("div", { style: { fontSize: 12.5, color: C.grisClair, marginTop: 6, lineHeight: 1.5 } },
                  `Vos ${mesHeures} heures de cours ne sont pas comptées ici : en micro-entreprise, l'exploitant ne se verse pas de salaire.`)
              : null),

          enseignants.map(({ p, seances, heures, montant }) => {
            const ouvert = deplie === p.id;
            const enEdition = edition && edition.id === p.id;
            return h(Carte, { key: p.id, style: { marginBottom: 10 } },
              h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 } },
                h("div", { style: { minWidth: 0, flex: 1 } },
                  h("div", { style: { fontSize: 16, fontWeight: 700, color: C.texte, fontFamily: FD } },
                    [p.prenom, p.nom].filter(Boolean).join(" ") || p.email),
                  h("div", { style: { fontSize: 12.5, color: C.gray, marginTop: 3 } },
                    `${seances.length} séance${seances.length > 1 ? "s" : ""} · ${heures} h · ${montantTxt(tauxDe(p))}/h`)),
                h("div", { style: { fontSize: 20, fontWeight: 700, color: montant > 0 ? C.texte : C.grisClair, fontFamily: FD, whiteSpace: "nowrap" } },
                  euros(montant))),

              enEdition
                ? h("div", { style: { display: "flex", gap: 6, alignItems: "center", marginTop: 12 } },
                    h("input", {
                      value: edition.valeur, autoFocus: true,
                      inputMode: edition.champ === "taux" ? "decimal" : "tel",
                      placeholder: edition.champ === "taux" ? "25" : "06 12 34 56 78",
                      onChange: e => setEdition({ id: p.id, champ: edition.champ, valeur: e.target.value }),
                      style: {
                        flex: 1, background: C.surface, border: `1px solid ${C.bord}`, borderRadius: 10,
                        padding: "10px 12px", color: C.texte, fontSize: 16, fontFamily: "inherit",
                        outline: "none", boxSizing: "border-box"
                      }
                    }),
                    h("span", { style: { fontSize: 14, color: C.gray, whiteSpace: "nowrap" } },
                      edition.champ === "taux" ? "€/h" : "☎"),
                    h(BtnPrimary, { label: "OK", onClick: () => enregistrer(p) }),
                    h(BtnSecondary, { label: "✕", onClick: () => setEdition(null) }))
                : h("div", { style: { display: "flex", gap: 6, marginTop: 12, flexWrap: "wrap" } },
                    seances.length > 0
                      ? h(BtnLigne, {
                          label: envoi === p.id ? "Copié" : p.telephone ? "Envoyer sur WhatsApp" : "Copier le récapitulatif",
                          icone: "💬",
                          teinte: "#0b6b37", fond: C.whatsappPale, bord: C.whatsappBord,
                          onClick: () => envoyer(p, seances, heures, montant)
                        })
                      : null,
                    h(BtnLigne, {
                      label: `Taux : ${montantTxt(tauxDe(p))}/h`, icone: "💶",
                      onClick: () => setEdition({ id: p.id, champ: "taux", valeur: String(tauxDe(p)) })
                    }),
                    h(BtnLigne, {
                      label: p.telephone ? "Changer le numéro" : "Ajouter son numéro", icone: "☎",
                      teinte: p.telephone ? C.texte : C.orange,
                      fond: p.telephone ? C.surface2 : C.orangePale,
                      bord: p.telephone ? C.bord : C.orangeBord,
                      onClick: () => setEdition({ id: p.id, champ: "tel", valeur: p.telephone || "" })
                    }),
                    seances.length > 0
                      ? h(BtnLigne, {
                          label: ouvert ? "Masquer le détail" : "Voir le détail",
                          icone: ouvert ? "▴" : "📋",
                          onClick: () => setDeplie(ouvert ? null : p.id)
                        })
                      : null),

              ouvert
                ? h("div", { style: { marginTop: 10 } },
                    seances.map(s => h("div", {
                      key: `${s.groupeId}:${s.date}`,
                      style: {
                        display: "flex", justifyContent: "space-between", gap: 10,
                        padding: "8px 2px", borderBottom: `1px solid ${C.bord}`, fontSize: 13.5
                      }
                    },
                      h("span", { style: { color: C.texte } }, `${fmtDateCourt(s.date)} — ${s.groupe}`),
                      h("span", { style: { color: C.gray, whiteSpace: "nowrap" } },
                        `${s.presents} présent${s.presents > 1 ? "s" : ""}`))))
                : null);
          }),

          h("div", { style: { fontSize: 12.5, color: C.grisClair, lineHeight: 1.6, marginTop: 14 } },
            "Ces montants ne sont pas des factures : ils récapitulent ce que vous devez. ",
            "Un professeur auto-entrepreneur vous adressera sa propre facture — ce décompte sert à la vérifier.")));
}
// ─── SUIVI DE SÉANCE ─────────────────────────────────────────
// Un compte-rendu par élève et par séance : ce qui a été travaillé, ce qui a
// bloqué, les progrès, le travail à faire. C'est la matière première du bilan
// hebdomadaire envoyé aux parents.
//
// Contrainte de conception : la saisie se fait à 20 h, debout, en fin de cours,
// pour six élèves d'affilée. Tout est pensé pour tenir en deux minutes — une
// appréciation en un tap, le tronc commun du groupe saisi une seule fois, et
// les notions déjà écrites reproposées en pastilles cliquables.

const NIVEAUX_SEANCE = [
  { k: "excellent", e: "🌟", l: "Excellent", c: "#4caf7d" },
  { k: "bien",      e: "👍", l: "Bien",      c: "#8bc34a" },
  { k: "moyen",     e: "😐", l: "Moyen",     c: "#e09030" },
  { k: "difficile", e: "🧗", l: "Difficile", c: "#e05555" }
];
const niveauSeanceCfg = k => NIVEAUX_SEANCE.find(x => x.k === k) || null;

const estCompteRenduVide = v =>
  !((v.notions || "").trim() || (v.difficultes || "").trim() ||
    (v.progres || "").trim() || (v.devoirs || "").trim() || v.niveau_seance);

function MiniArea({ label, value, onChange, placeholder, rows }) {
  return h("div", { style: { marginBottom: 10 } },
    label && h("div", { style: { fontSize: 10, fontWeight: 700, color: C.gold, letterSpacing: ".8px", textTransform: "uppercase", marginBottom: 4 } }, label),
    h("textarea", {
      value: value || "",
      onChange: e => onChange(e.target.value),
      placeholder: placeholder || "",
      rows: rows || 2,
      style: {
        width: "100%", background: C.surface, border: `1px solid ${C.bord}`,
        borderRadius: 8, padding: "9px 11px", color: C.texte, fontSize: 14, fontFamily: "inherit",
        outline: "none", boxSizing: "border-box", resize: "vertical", lineHeight: 1.5
      }
    })
  );
}

function Suggestions({ items, onPick }) {
  if (!items.length) return null;
  return h("div", { style: { display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 } },
    items.map(t => h("button", {
      key: t,
      onClick: () => onPick(t),
      style: { background: C.navyPale, border: `1px solid ${C.bord}`, borderRadius: 20, padding: "5px 11px", color: C.navyL, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }
    }, "+ " + t))
  );
}

function CarteSuiviEleve({ eleve, valeur, onChange, ouvert, onToggleOuvert, suggestions }) {
  const v = valeur || {};
  const set = (k, val) => onChange({ ...v, [k]: val });
  const cfg = niveauSeanceCfg(v.niveau_seance);
  const rempli = !estCompteRenduVide(v);
  const ajouterNotion = t => set("notions", (v.notions || "").trim() ? `${v.notions.trim()}, ${t}` : t);

  return h("div", {
    style: {
      background: rempli ? C.navyPale : C.surface,
      border: `1px solid ${rempli ? C.goldBord : C.bord}`,
      borderRadius: 14, padding: 13, marginBottom: 10
    }
  },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 10 } },
      h(Avatar, { p: eleve.prenom, n: eleve.nom, s: 38 }),
      h("div", { style: { flex: 1, minWidth: 0 } },
        h("div", { style: { fontSize: 15, fontWeight: 800, color: C.texte, fontFamily: FD } }, `${eleve.prenom} ${eleve.nom}`),
        h("div", { style: { fontSize: 11, color: C.gray } }, eleve.niveau)),
      cfg && h("span", { style: { fontSize: 18 } }, cfg.e)
    ),

    h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6, marginBottom: 10 } },
      NIVEAUX_SEANCE.map(n => {
        const on = v.niveau_seance === n.k;
        return h("button", {
          key: n.k,
          onClick: () => set("niveau_seance", on ? null : n.k),
          style: {
            background: on ? `${n.c}22` : C.surface,
            border: on ? `2px solid ${n.c}` : `1px solid ${C.bord}`,
            borderRadius: 10, padding: "7px 2px", cursor: "pointer", fontFamily: "inherit",
            display: "flex", flexDirection: "column", alignItems: "center", gap: 2
          }
        },
          h("span", { style: { fontSize: 16 } }, n.e),
          h("span", { style: { fontSize: 9, fontWeight: 700, color: on ? n.c : C.gray } }, n.l));
      })
    ),

    h(MiniArea, {
      label: "Difficultés rencontrées",
      value: v.difficultes,
      onChange: t => set("difficultes", t),
      placeholder: `Ce qui a bloqué ${eleve.prenom} aujourd'hui…`
    }),

    h("button", {
      onClick: onToggleOuvert,
      style: { background: "none", border: "none", color: C.gold, cursor: "pointer", fontSize: 12, fontWeight: 700, fontFamily: "inherit", padding: "2px 0" }
    }, ouvert ? "− Moins de détails" : "+ Notions, progrès, devoirs"),

    ouvert && h("div", { className: "fx-fade-slide-up", style: { marginTop: 10, borderTop: `1px solid ${C.bord}`, paddingTop: 10 } },
      h(Suggestions, { items: suggestions, onPick: ajouterNotion }),
      h(MiniArea, { label: "Travaillé avec cet élève", value: v.notions, onChange: t => set("notions", t), placeholder: "Thalès, équations…" }),
      h(MiniArea, { label: "Progrès / points forts", value: v.progres, onChange: t => set("progres", t), placeholder: "Ce qui a bien marché…" }),
      h(MiniArea, { label: "Travail pour la prochaine fois", value: v.devoirs, onChange: t => set("devoirs", t), placeholder: "Exercices 12 à 15 p. 84" })
    )
  );
}

function ModuleSuivi({ eleves, groupes, appels, comptesRendus, monProfilId, onSave }) {
  const [etape, setEtape] = useState("groupes");
  const [date, setDate] = useState(todayStr());
  const [grp, setGrp] = useState(null);
  const [brouillon, setBrouillon] = useState({});
  const [commun, setCommun] = useState("");
  const [ouvert, setOuvert] = useState(null);
  const [saving, setSaving] = useState(false);

  const elevesMap = {};
  eleves.forEach(e => { elevesMap[e.id] = e; });

  const crsDuJour = (gid, d) => comptesRendus.filter(c => c.groupe_id === gid && c.date === d);
  // Rouvrir un suivi doit montrer ce qui a été écrit, jamais un formulaire vierge.
  const chargerBrouillon = (gid, d) => {
    const deja = {};
    crsDuJour(gid, d).forEach(c => {
      deja[c.eleve_id] = {
        notions: c.notions || "", difficultes: c.difficultes || "",
        progres: c.progres || "", devoirs: c.devoirs || "", niveau_seance: c.niveau_seance || null
      };
    });
    return deja;
  };

  const ouvrirGroupe = g => {
    setGrp(g);
    setBrouillon(chargerBrouillon(g.id, date));
    setCommun("");
    setOuvert(null);
    setEtape("saisie");
  };

  const changerDate = d => {
    setDate(d);
    if (grp) setBrouillon(chargerBrouillon(grp.id, d));
  };

  if (etape === "groupes") {
    return h("div", null,
      h("div", { style: { background: C.navyPale, border: `1px solid ${C.bord}`, borderRadius: 14, padding: 14, marginBottom: 16 } },
        h(Lbl, { text: "Date de la séance" }),
        h("input", {
          type: "date", value: date, onChange: e => setDate(e.target.value),
          style: { width: "100%", background: C.surface, border: `1px solid ${C.bord}`, borderRadius: 8, padding: "10px 12px", color: C.texte, fontSize: 16, fontFamily: "inherit", outline: "none", boxSizing: "border-box", colorScheme: "light" }
        }),
        h("div", { style: { fontSize: 13, color: C.gray, marginTop: 6 } },
          "📅 " + new Date(date).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }))
      ),
      h(Lbl, { text: "Rédiger le compte-rendu" }),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
        groupes.map(g => {
          const nbCR = crsDuJour(g.id, date).length;
          const appelFait = !!appels[`ap:${g.id}:${date}`];
          return h("button", {
            key: g.id,
            onClick: () => ouvrirGroupe(g),
            style: {
              background: nbCR ? C.navyPale : C.surface,
              border: nbCR ? `1.5px solid ${C.bord}` : `1px solid ${C.bord}`,
              borderRadius: 14, padding: 16, cursor: "pointer", fontFamily: "inherit", textAlign: "left"
            }
          },
            h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 } },
              h("div", null,
                h("div", { style: { fontSize: 17, fontWeight: 800, color: C.texte, fontFamily: FD, marginBottom: 4 } },
                  g.nom, h("span", { style: { fontSize: 11, fontWeight: 700, color: C.gold, marginLeft: 8 } }, g.matiere)),
                h("div", { style: { fontSize: 12, color: C.gray } },
                  horaireLabel(g), " • ", (g.eids || []).length, " élèves", appelFait ? "" : " • appel non fait")),
              nbCR
                ? h("span", { style: { fontSize: 11, fontWeight: 700, color: C.navyL, background: C.navyPale, padding: "4px 10px", borderRadius: 20, whiteSpace: "nowrap" } }, `✓ ${nbCR} rédigé${nbCR > 1 ? "s" : ""}`)
                : h("span", { style: { color: C.gray, fontSize: 20 } }, "›")));
        }),
        groupes.length === 0 && h("div", { style: { textAlign: "center", padding: "30px 0", color: C.gray, fontSize: 13 } }, "Aucun groupe pour l'instant.")
      )
    );
  }

  if (etape === "confirme") {
    return h("div", { className: "fx-fade-slide-up", style: { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "50vh", textAlign: "center", padding: "0 20px" } },
      h("div", { className: "fx-pop-in", style: { width: 80, height: 80, borderRadius: "50%", background: C.navyPale, border: `3px solid ${C.gold}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 40, marginBottom: 20 } }, "📝"),
      h("div", { style: { fontSize: 24, fontWeight: 800, color: C.texte, fontFamily: FD, marginBottom: 6 } }, "Compte-rendu enregistré !"),
      h("div", { style: { fontSize: 14, color: C.gray, marginBottom: 20 } }, `${grp.nom} • ${fmtDateLongue(date)}`),
      h("div", { style: { fontSize: 13, color: C.gray, marginBottom: 24, maxWidth: 300, lineHeight: 1.6 } },
        "Il alimentera automatiquement le bilan hebdomadaire envoyé aux parents."),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 10, width: "100%", maxWidth: 280 } },
        h(BtnSecondary, { label: "✏️ Modifier", onClick: () => setEtape("saisie") }),
        h(BtnPrimary, { label: "← Retour aux groupes", onClick: () => { setEtape("groupes"); setGrp(null); }, full: true }))
    );
  }

  const presMap = appels[`ap:${grp.id}:${date}`] || {};
  const appelFait = Object.keys(presMap).length > 0;
  const listeIds = appelFait ? (grp.eids || []).filter(id => presMap[id] === "present") : (grp.eids || []);

  const suggestions = [...new Set(
    comptesRendus.filter(c => c.groupe_id === grp.id).flatMap(c => splitNotions(c.notions))
  )].slice(0, 8);

  const appliquerATous = () => {
    const t = commun.trim();
    if (!t) return;
    const next = { ...brouillon };
    listeIds.forEach(id => {
      const v = next[id] || {};
      const deja = splitNotions(v.notions).some(x => x.toLowerCase() === t.toLowerCase());
      next[id] = { ...v, notions: deja ? v.notions : ((v.notions || "").trim() ? `${v.notions.trim()}, ${t}` : t) };
    });
    setBrouillon(next);
    setCommun("");
  };

  const enregistrer = async () => {
    setSaving(true);
    try {
      const complet = {};
      listeIds.forEach(id => { complet[id] = brouillon[id] || {}; });
      await onSave(grp.id, date, complet, monProfilId);
      setEtape("confirme");
    } catch (e) {
      signalerErreur(e);
    }
    setSaving(false);
  };

  const nbRemplis = listeIds.filter(id => !estCompteRenduVide(brouillon[id] || {})).length;

  return h("div", null,
    h("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 12 } },
      h("div", { style: { fontSize: 15, fontWeight: 800, color: C.texte, fontFamily: FD } }, grp.nom),
      h("span", { style: { fontSize: 11, fontWeight: 700, color: C.gold } }, grp.matiere),
      h("button", {
        onClick: () => { setEtape("groupes"); setGrp(null); },
        style: { marginLeft: "auto", background: "none", border: "none", color: C.gold, cursor: "pointer", fontSize: 14, fontFamily: "inherit", fontWeight: 700 }
      }, "← Groupes")
    ),
