<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#0a1428;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fafaf7;overscroll-behavior:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  input,select,textarea,button{font-family:inherit;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(212,175,55,.3);border-radius:4px;}

  @keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{0%{opacity:0;transform:scale(.85);}70%{opacity:1;transform:scale(1.04);}100%{opacity:1;transform:scale(1);}}
  @keyframes pulseGlow{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.72;transform:scale(1.05);}}
  @keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(160px) rotate(360deg);opacity:0;}}

  .fx-fade-slide-up{animation:fadeSlideUp .32s cubic-bezier(.22,1,.36,1) both;}
  .fx-pop-in{animation:popIn .38s cubic-bezier(.22,1,.36,1) both;}
  .fx-pulse-glow{animation:pulseGlow 1.8s ease-in-out infinite;}

  [style*="cursor: pointer"]{transition:transform .12s cubic-bezier(.22,1,.36,1);}
  [style*="cursor: pointer"]:active{transform:scale(.97);}
  button{transition:transform .12s cubic-bezier(.22,1,.36,1);}
  button:active{transform:scale(.96);}
  a:active{transform:scale(.97);}

  /* Impression : seule la facture doit sortir sur le papier. Sans ces règles,
     window.print() emportait toute l'interface autour — boutons compris. */
  @media print{
    @page{margin:12mm;}
    body{background:#fff !important;}
    .sans-impression{display:none !important;}
    body *{visibility:hidden;}
    .facture-papier,.facture-papier *{visibility:visible;}
    .facture-papier{
      position:absolute;left:0;top:0;width:100%;
      margin:0 !important;border-radius:0 !important;box-shadow:none !important;
    }
  }
</style>
