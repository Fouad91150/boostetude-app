<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:#f3f4f8;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:16px;line-height:1.5;color:#121c2e;
    overscroll-behavior:none;
    padding-top:env(safe-area-inset-top);
  }
  input,select,textarea,button{font-family:inherit;}
  /* 16 px minimum dans un champ : en dessous, le téléphone zoome tout seul
     quand on le touche, et la page saute sous le doigt. */
  input,select,textarea{font-size:16px;}
  input:focus,select:focus,textarea:focus{outline:2px solid #1d3557;outline-offset:1px;border-color:#1d3557 !important;}
  button:focus-visible{outline:2px solid #1d3557;outline-offset:2px;}
  a{color:#1d3557;}
  h1,h2,h3{line-height:1.25;font-weight:700;}
  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#ced4df;border-radius:5px;}

  @keyframes fadeSlideUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes popIn{0%{opacity:0;transform:scale(.85);}70%{opacity:1;transform:scale(1.04);}100%{opacity:1;transform:scale(1);}}
  @keyframes pulseGlow{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.72;transform:scale(1.05);}}

  .fx-fade-slide-up{animation:fadeSlideUp .28s cubic-bezier(.22,1,.36,1) both;}
  .fx-pop-in{animation:popIn .34s cubic-bezier(.22,1,.36,1) both;}
  .fx-pulse-glow{animation:pulseGlow 1.8s ease-in-out infinite;}

  [style*="cursor: pointer"]{transition:transform .12s cubic-bezier(.22,1,.36,1);}
  [style*="cursor: pointer"]:active{transform:scale(.98);}
  button{transition:transform .12s cubic-bezier(.22,1,.36,1),background .15s;}
  button:active{transform:scale(.97);}

  /* Impression : seule la facture doit sortir sur le papier. Sans ces règles,
     window.print() emportait toute l'interface autour — boutons compris. */
  @media print{
    @page{margin:12mm;}
    body{background:#fff !important;}
    .sans-impression{display:none !important;}
    body *{visibility:hidden;}
    .facture-papier,.facture-papier *{visibility:visible;}
    .facture-papier{
      position:absolute;left:0;top:0;width:100%;
      margin:0 !important;border-radius:0 !important;box-shadow:none !important;
    }
  }
</style>
</head>
