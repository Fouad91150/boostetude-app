# Publication automatique sur Hostinger.
#
# À chaque mise à jour de `main`, le dossier dist/ (déjà construit et vérifié
# par `npm test`) est envoyé par FTP sur l'hébergement Hostinger.
#
# Réglage, une seule fois, dans GitHub → Settings → Secrets and variables →
# Actions → New repository secret :
#   FTP_SERVEUR       ex. ftp.mondomaine.fr (ou l'adresse IP indiquée par Hostinger)
#   FTP_UTILISATEUR   ex. u123456789 (hPanel → Fichiers → Comptes FTP)
#   FTP_MOT_DE_PASSE  le mot de passe de ce compte FTP
#   FTP_DOSSIER       (facultatif) dossier de destination, par défaut public_html/app/
#
# Tant que les secrets ne sont pas renseignés, l'étape est sautée sans erreur.
name: Publication Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      FTP_SERVEUR: ${{ secrets.FTP_SERVEUR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier avant d'envoyer
        run: |
          npm ci
          npm test

      - name: Secrets absents
        if: env.FTP_SERVEUR == ''
        run: echo "::notice::Secrets FTP non renseignés : publication Hostinger sautée."

      - name: Envoyer dist/ sur Hostinger
        if: env.FTP_SERVEUR != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVEUR }}
          username: ${{ secrets.FTP_UTILISATEUR }}
          password: ${{ secrets.FTP_MOT_DE_PASSE }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DOSSIER || 'public_html/app/' }}
